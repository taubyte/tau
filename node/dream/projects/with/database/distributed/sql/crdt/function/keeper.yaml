id: QmNPFXqtFpZ3HvPv1r9Dzz47FuN7j2u7yUFNDK4HFQhKEa
description: runs the statement it was sent against the sql database it was granted - the path picks query or exec
source: services/keeper
build:
    commands:
        image: tau-fixtures/rust-component:0.21.1
        install: cargo fetch --locked
        run: cargo component build --release --locked --target wasm32-wasip2
        output: target/wasm32-wasip1/release/cacher.wasm
execution:
    call: handle
    timeout: 15s
    memory: 32MB
database:
    ledger:
        ops: [query, exec]
