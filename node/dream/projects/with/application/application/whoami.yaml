description: echoes the request it was handed, so an answer proves it came from inside the container and not from a constant
package:
    name: whoami_code
# the port the image already listens on - an off-the-shelf image binds its own
# number whatever it is told, so the tier maps this rather than handing it $PORT
ports:
    http:
        number: 80
execution:
    memory: 64MB
