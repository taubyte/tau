id: QmNP8ZJRT6En1LVfTwkbiD4HgdeRxvpHGn4m5Sp2cY8UxS
description: writes on the path it is asked on and reads on another - one component on both ends, so a read answered on a second node is the object and not a second copy of the component's own state
source: services/cacher
build:
    commands:
        image: ghcr.io/samyfodil/wazy-build-rust:1.99.1-cc0.21.1
        install: cargo fetch --locked
        run: cargo component build --release --locked --target wasm32-wasip2
        output: target/wasm32-wasip1/release/cacher.wasm
execution:
    call: handle
    timeout: 15s
    memory: 32MiB
storage:
    receipts:
        ops: [get, head, put, delete, list]
