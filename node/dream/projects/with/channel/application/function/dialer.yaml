id: QmdyFJcaZzjFwjSw1NJdQGkYNhvG1kWtZAhM8SZBaAaLuR
description: the near end - invoked from outside, it dials the channel and answers with whatever came back over the socket
source: services/cacher
build:
    commands:
        image: ghcr.io/samyfodil/wazy-build-rust:1.99.1-cc0.21.1
        install: cargo fetch --locked
        run: cargo component build --release --locked --target wasm32-wasip2
        output: target/wasm32-wasip1/release/cacher.wasm
execution:
    call: handle
    timeout: 15s
    memory: 32MiB
channel:
    reserve:
        ops: [dial]
