id: QmNP8ZJRT6En1LVfTwkbiD4HgdeRxvpHGn4m5Sp2cY8UxS
description: sends on the path it is asked on, and receives on the delivery path it declares - so one component is both the producer and the consumer
source: services/cacher
build:
    commands:
        image: rust:1.83
        install: cargo fetch --locked
        run: cargo build --release --target wasm32-wasip2
        output: target/wasm32-wasip2/release/cacher.wasm
execution:
    call: handle
    timeout: 15s
    memory: 32MiB
cache:
    sessions:
        ops: [get, put]
sync:
    jobs:
        ops: [send, receive]
        deliver:
            path: /put/sessions/done
