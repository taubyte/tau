id: QmNP8ZJRT6En1LVfTwkbiD4HgdeRxvpHGn4m5Sp2cY8UxS
description: the appender and the reader are one component - what it is told a record landed at is the cursor it reads forward from, so the two halves cannot disagree about a position
source: services/cacher
build:
    commands:
        image: rust:1.83
        install: cargo fetch --locked
        run: cargo build --release --target wasm32-wasip2
        output: target/wasm32-wasip2/release/cacher.wasm
execution:
    call: handle
    timeout: 15s
    memory: 32MiB
sync:
    audit:
        ops: [append, read]
