id: QmPsgdz4diNQNEcNk9Yt1JBsHeWCaB3y2rJjYUBRokm58Q
description: answers in JavaScript, through componentize-js
source: services/js
build:
    commands:
        image: ghcr.io/samyfodil/wazy-build-js:1.39.0-cjs0.23.0-node22.23.4
        run: jco componentize function.js --wit ../../wit --world-name handler -o function.wasm
        output: function.wasm
execution:
    call: handle
    timeout: 15s
    memory: 128MiB
