id: QmZVW4utwcqPcze7nAm1MyrJteLCKqAE8UKjtmbX8qDLCv
description: answers in C++, over wit-bindgen's C bindings and wasi-sdk
runtime: wasm
source: services/cpp
build:
    commands:
        image: ghcr.io/samyfodil/wazy-build-c:34.0
        run: wit-bindgen c --out-dir gen --world handler ../../wit && clang --target=wasm32-wasip2 -O2 -c gen/handler.c -o gen/handler.o && clang++ --target=wasm32-wasip2 -O2 -fno-exceptions -mexec-model=reactor function.cpp gen/handler.o gen/handler_component_type.o -o function.wasm
        output: function.wasm
execution:
    call: handle
    timeout: 15s
    memory: 128MiB
