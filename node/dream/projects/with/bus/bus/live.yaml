description: the topic, and the name a browser attaches to - writing `host:` is the whole difference between a bus the project can reach and one the internet can
# NO `instances:` BLOCK, DELIBERATELY. One bus, one topic, nothing for a caller
# to name - which is the shape a gateway can serve today, and it is attached to
# at `/`. A bus that admits instances through a validator is addressed by path
# and refused by name, so adding the block here would take this project's
# browser off the door it dials.
host:
    zone:
        name: live
        in:
            name: example_com
