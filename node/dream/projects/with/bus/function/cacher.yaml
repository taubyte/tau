id: QmNP8ZJRT6En1LVfTwkbiD4HgdeRxvpHGn4m5Sp2cY8UxS
description: publishes on the path it is asked on - it declares `publish` and nothing else, so the grant it runs under is the one thing that could put a message on the topic
source: services/cacher
build:
    commands:
        image: rust:1.83
        install: cargo fetch --locked
        run: cargo build --release --target wasm32-wasip2
        output: target/wasm32-wasip2/release/cacher.wasm
execution:
    call: handle
    timeout: 15s
    memory: 32MiB
bus:
    live:
        ops: [publish]
