id: QmNP8ZJRT6En1LVfTwkbiD4HgdeRxvpHGn4m5Sp2cY8UxS
description: publishes on the path it is asked on, and declares the subscription on the same topic - so one component is both ends of the stream, the way the queue project is both ends of a queue
runtime: wasm
source: services/cacher
build:
    commands:
        image: ghcr.io/samyfodil/wazy-build-rust:1.99.1-cc0.21.1
        install: cargo fetch --locked
        run: cargo component build --release --locked --target wasm32-wasip2
        output: target/wasm32-wasip1/release/cacher.wasm
execution:
    call: handle
    timeout: 15s
    memory: 32MiB
cache:
    sessions:
        ops: [get, put]
stream:
    orders:
        ops: [publish, subscribe]
        deliver:
            path: /put/sessions/delivered
