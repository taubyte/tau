id: QmSSumLpvBM8vHPASQuwdRwi1YyuXTwdR3opsg5VqzowuH
description: runs in region-2, and reaches the cache in region-1
source: services/reader
build:
    commands:
        image: rust:1.83
        run: cargo build --release --target wasm32-wasip2
        output: target/wasm32-wasip2/release/reader.wasm
execution:
    call: handle
    timeout: 15s
    memory: 32MB
regions:
    pinned: [region-2]
cache:
    sessions_r1:
        ops: [get]
