id: QmSSumLpvBM8vHPASQuwdRwi1YyuXTwdR3opsg5VqzowuH
description: runs in region-2, and reaches the cache in region-1
source: services/reader
build:
    commands:
        image: ghcr.io/samyfodil/wazy-build-rust:1.99.1-cc0.21.1
        install: cargo fetch --locked
        run: cargo component build --release --locked --target wasm32-wasip2
        output: target/wasm32-wasip1/release/cacher.wasm
execution:
    call: handle
    timeout: 15s
    memory: 32MB
regions:
    pinned: [region-2]
cache:
    sessions_r1:
        ops: [get]
