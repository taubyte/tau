version: v2
# Workspace spanning the community spore-drive, taucorder and v2 protos, and
# a private submodule's protos, so that module can import
# config/v1. When the submodule is checked out all modules resolve; buf
# generate is dev-time and this team always has the submodule.
#
# Membership here is what gives a module the workspace's shared lint/breaking
# config below instead of buf's bare defaults — pkg/v2/proto and
# pkg/spore-drive/proto carry no buf.yaml of their own for exactly that
# reason. pkg/sensors/proto is deliberately not listed: it has its own
# buf.yaml and has never needed to import across modules, so it stays
# independent rather than joining a workspace it doesn't use.
modules:
  - path: pkg/spore-drive/proto
  - path: pkg/taucorder/proto
  - path: pkg/v2/proto
  - path: ee/proto
lint:
  use:
    - STANDARD
  except:
    - RPC_REQUEST_RESPONSE_UNIQUE
    - ENUM_VALUE_UPPER_SNAKE_CASE
    - ENUM_VALUE_PREFIX
    - ENUM_ZERO_VALUE_SUFFIX
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
breaking:
  use:
    - FILE
