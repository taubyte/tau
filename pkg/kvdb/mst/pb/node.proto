syntax = "proto3";
package kvdb.mst;

option go_package = ".;pb";

// A Node is the Data of one dag-pb block of a Merkle search tree. Its
// subtrees are the block's links, in key order, and the node names each one
// by position: the flags below say which subtree slots hold one, and the
// n-th set flag, counting left first and then each entry's right in order,
// is the n-th link. The format is specified in the mst package's doc.
message Node {
  // The format profile. Always 1.
  uint32 format = 1;
  // The level of every key in this node.
  uint32 level = 2;
  // A subtree precedes the first entry.
  bool left = 3;
  // The caller's summary of that subtree.
  bytes left_summary = 4;
  // The entries, in ascending unsigned byte order of key.
  repeated Entry entries = 5;
}

message Entry {
  // How many leading bytes the key shares with the previous entry's key:
  // always the longest such prefix, and 0 for the first entry.
  uint32 shared = 1;
  // The key's remaining bytes.
  bytes suffix = 2;
  bytes value = 3;
  // A subtree follows this entry.
  bool right = 4;
  // The caller's summary of that subtree.
  bytes right_summary = 5;
}
