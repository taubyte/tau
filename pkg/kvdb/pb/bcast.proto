syntax = "proto3";
package crdt.pb;

import "delta.proto";

option go_package = ".;pb";

message CRDTBroadcast {
  repeated Head Heads = 1; // A list of heads
  // since is the fleet time the sender had last heard; while it is
  // rejoining, the fleet time it had heard before its gap.
  uint64 since = 2;
  // now is the sender's clock.
  uint64 now = 3;
  // rejoining is set while the sender waits to be judged after a gap.
  bool rejoining = 4;
  // incarnation is the sender's current incarnation.
  bytes incarnation = 5;
  // verdict answers a rejoining replica.
  Verdict verdict = 6;
  // acks are the sender's entries for the incarnations that wrote lately:
  // their authors learn what of theirs has reached the fleet.
  repeated Entry acks = 7;
  // horizon is the latest authored time of anything the sender has
  // forgotten: a replica that hears it knows the fleet forgot that much
  // before it holds any of the fleet's blocks.
  uint64 horizon = 8;
  // context is the sender's causal context, in a heartbeat of a replica that
  // has heard a fleet and is not rejoining, and in every verdict: what it
  // holds, for a peer to tell whether it holds as much.
  Context context = 9;
  // settled is set when the sender held, as it sent this, all that every
  // peer it hears holds, and knows it has heard them all.
  bool settled = 10;
  // heard are the peers the sender heard within G, with its context: a peer
  // that is not settled may have heard a fleet this replica has not.
  repeated bytes heard = 11;
  // sent counts what the sender broadcast: of two frontiers of one
  // incarnation, the one sent later has the higher count, in whatever order
  // they arrive and whatever its clock said.
  uint64 sent = 12;
  // turned is the sent of the frontier in which the sender last came to
  // lack what a live peer said it holds: a peer that missed that one, or
  // the one before it, still sees the turn.
  uint64 turned = 13;
}

// A Verdict tells one rejoining incarnation whether the sender can still
// refute what it may carry (ok) or not (rebase), and the sender's since.
message Verdict {
  bytes to = 1;
  bool rebase = 2;
  uint64 since = 3;
  // held is, in an ok, the fleet time as of which the sender holds all that
  // the fleet held: what it vouches for.
  uint64 held = 4;
}

message Head {
  bytes Cid = 1;
  reserved 2;
  reserved "DagName";
  Dot dot = 3;
  uint64 at = 4;
  uint64 ttl = 5;
}
