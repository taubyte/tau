syntax = "proto3";
package crdt.pb;

import "state.proto";

option go_package = ".;pb";

// A Dot names one delta: the incarnation that wrote it and that incarnation's
// counter for it. An element's identity is (key, dot).
message Dot {
  bytes replica = 1;
  uint64 counter = 2;
}

// A Parent is one block a delta links, with that block's dot and stamps, so a
// reader can tell a parent it already covers, or one nobody holds any more,
// without fetching it.
message Parent {
  bytes cid = 1;
  Dot dot = 2;
  uint64 at = 3;
  uint64 ttl = 4;
}

// An Entry is what a context knows of one incarnation: the counters in
// (base, counter] are covered, changed is the latest authored time of
// anything merged about it, and expires the latest time any of that is still
// needed. Times are milliseconds since the epoch.
message Entry {
  bytes replica = 1;
  uint64 base = 2;
  uint64 counter = 3;
  uint64 changed = 4;
  uint64 expires = 5;
}

// A Span is a run of an incarnation's counters covered out of order: (lo, hi].
// The author's counters inside it that are not hi were never used.
message Span {
  bytes replica = 1;
  uint64 lo = 2;
  uint64 hi = 3;
}

// A Context is a causal context: an entry per incarnation still known, plus
// the spans covered beyond a gap in an entry.
message Context {
  repeated Entry vector = 1;
  repeated Span cloud = 2;
}

// A Delta is a block: a plain delta, whose elements and tombstones are what
// it writes, or a snapshot, whose state is named by state.
message Delta {
  repeated Element elements = 1;
  // tombstones name the (key, dot) versions this delta removes.
  repeated Element tombstones = 2;
  uint64 priority = 3;
  reserved 4, 6, 7, 11, 12;
  reserved "dagName", "snapshotTotal", "snapshotId", "context", "chunks";
  bool snapshot = 5;
  Dot dot = 8;
  // prev is the author's counter for its previous delta in the same
  // incarnation, 0 for its first.
  uint64 prev = 9;
  repeated Parent parents = 10;
  // at is when the author wrote this block, in milliseconds since the epoch:
  // the later of its clock and the fleet time it had last heard.
  uint64 at = 13;
  // ttl is the author's retention when it wrote this block, in milliseconds:
  // what the block teaches is kept until at + ttl, plus the margin.
  uint64 ttl = 14;
  // since is the fleet time the author had last heard: in a snapshot, how
  // recent the state it carries is.
  uint64 since = 15;
  // horizon is the latest authored time of anything the author has
  // forgotten because it expired.
  uint64 horizon = 16;
  // state is, in a snapshot, the CID of the StateRoot block holding the
  // state it carries (see state.proto).
  bytes state = 17;
  // root and trees are, in a snapshot, that StateRoot block's Data and the
  // CIDs of its links, in order: a reader rebuilds the block from them.
  StateRoot root = 18;
  repeated bytes trees = 19;
  // inline are, in a snapshot, whole blocks of its state's trees, each
  // linked by the StateRoot or by a block before it, at most 32 KiB in all
  // (see the kvdb package's state.go).
  repeated bytes inline = 20;
}

message Element {
  bytes key = 1;
  reserved 2, 4;
  reserved "id", "priority";
  bytes value = 3;
  // dot is the target's dot in a tombstone; a delta's elements take the
  // delta's dot.
  Dot dot = 5;
  // at and ttl are, for a tombstone, when the removal was written and how
  // long it is needed, which is never less than its target is.
  uint64 at = 6;
  uint64 ttl = 7;
}

// A DeltaBlock is the block of a delta, as a statetree Block: its links, then
// the delta as its data. A message is written as its bytes, so a
// DeltaBlock's bytes are the Block's, marshalled in one pass.
message DeltaBlock {
  repeated bytes links = 1;
  Delta data = 2;
}
