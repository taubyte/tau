[package]
name = "admitter"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen-rt = { version = "0.39", features = ["bitflags"] }

[package.metadata.component]
package = "taubyte:admitter"

[package.metadata.component.target]
# THE CANONICAL WORLD, not a copy — the same reason handler's fixture gives. The
# world lives in deps/ because a wit directory is one package and `handler` is
# already it; targeting a dep world by its full name is what the capability
# packages' own `world imports` are for.
path = "../../wit"
world = "taubyte:instance-validator/instance-validator"

[package.metadata.component.target.dependencies]
# EVERY PACKAGE THE wit/ DIRECTORY NAMES, not just this world's. cargo-component
# resolves the whole directory — handler.wit included — so a package missing here
# fails the build with an error pointing at a world this fixture does not target.
"taubyte:authorizer" = { path = "../../wit/deps/taubyte-authorizer" }
"taubyte:instance-validator" = { path = "../../wit/deps/taubyte-instance-validator" }
"taubyte:gateway-transformer" = { path = "../../wit/deps/taubyte-gateway-transformer" }
"taubyte:gateway-router" = { path = "../../wit/deps/taubyte-gateway-router" }
"taubyte:proxy-transformer" = { path = "../../wit/deps/taubyte-proxy-transformer" }
"taubyte:proxy-router" = { path = "../../wit/deps/taubyte-proxy-router" }
"taubyte:bus" = { path = "../../wit/deps/taubyte-bus" }
"taubyte:cache" = { path = "../../wit/deps/taubyte-cache" }
"taubyte:channel" = { path = "../../wit/deps/taubyte-channel" }
"taubyte:document" = { path = "../../wit/deps/taubyte-document" }
"taubyte:kv" = { path = "../../wit/deps/taubyte-kv" }
"taubyte:log" = { path = "../../wit/deps/taubyte-log" }
"taubyte:model" = { path = "../../wit/deps/taubyte-model" }
"taubyte:queue" = { path = "../../wit/deps/taubyte-queue" }
"taubyte:secret" = { path = "../../wit/deps/taubyte-secret" }
"taubyte:sql" = { path = "../../wit/deps/taubyte-sql" }
"taubyte:storage" = { path = "../../wit/deps/taubyte-storage" }
"taubyte:stream" = { path = "../../wit/deps/taubyte-stream" }
"taubyte:vector" = { path = "../../wit/deps/taubyte-vector" }
"taubyte:workflow" = { path = "../../wit/deps/taubyte-workflow" }
"taubyte:workload" = { path = "../../wit/deps/taubyte-workload" }

[profile.release]
opt-level = "s"
strip = true
