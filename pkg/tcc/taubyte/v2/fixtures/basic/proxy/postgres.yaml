id: QmTz6X9hTn18fpKxrnbE3BvmkZHy3r1mRyHzfXK3gVZLxR
description: an allocated address on the cloud's own zone - no port, no ip, and no zone name either; all three are the cloud's to decide
protocol: tcp
host:
    generated:
        name: db
service: postgres
tls:
    mode: none
transformers:
    - name: pg_audit
rate-limit:
    connections-per-minute: 120
    concurrent: 40
    key: subnet
forward:
    application:
        name: db
        port: pg
