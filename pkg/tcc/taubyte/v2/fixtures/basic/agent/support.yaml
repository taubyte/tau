id: QmXnnyufdzAWL5CqZ2RnSNgPbvCc1ALT73s6epPrRnZ1Za
description: answers questions about an order - its tools ARE its access block, there is no second list, so what it can do is a graph query
model:
    name: opus
instructions: instructions.md
memory:
    embedder:
        name: embed
    dimensions: 1536
    size: 2GB
limits:
    steps: 8
    concurrent: 4
database:
    orders:
        ops: [query]
    knowledge:
        ops: [search]
cache:
    orders:
        ops: [get]
function:
    checkout:
        ops: [invoke]
mcp:
    tools:
        ops: [list, call]
        tools: [checkout]
storage:
    receipts:
        ops: [get, list]
regions:
    pinned: [region-1]
