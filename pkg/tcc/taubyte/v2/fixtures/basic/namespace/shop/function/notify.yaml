id: QmbWqxBEKC3P8tqsKc98xmWNzrzDtRLMiMPL8wBuTGsMnR
description: in shop; its own sessions cache, the project-wide orders by absolute path, and local's relay by a RELATIVE one
package:
    name: notify_code
execution:
    call: notify
    timeout: 5s
    memory: 16MB
cache:
    sessions:
        ops: [get]
    orders:
        namespace: /
        ops: [get]
function:
    relay:
        namespace: local
        ops: [invoke]
stream:
    orders:
        namespace: /
        ops: [subscribe]
bus:
    chat:
        namespace: /
        ops: [publish]
