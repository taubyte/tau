id: QmXjjmDUAsdBnCLnMmnbi9WdPYYbCbAdYSpuvfvBBnvLPP
description: in shop/eu; its own cache with no path, billing's books by absolute path, and the project-wide work queue it is dispatched from - a wasm consumer needs no deliver block, the call is the delivery
execution:
    call: relay
    timeout: 5s
    memory: 8MB
cache:
    sessions:
        ops: [get]
database:
    ledger:
        namespace: /billing
        ops: [query]
queue:
    orders:
        namespace: /
        ops: [receive]
