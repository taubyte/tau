description: the zone this cloud answers for; the gateway's own name needs no record here
fqdn: example.com

# THE FILE IS THE ONLY PLACE THE RECORDS ARE WRITTEN. It used to say them twice --
# once as this path and once as a list of strings -- because nothing joined the two,
# and a zone that declared only the file answered nothing. The compile reads it now
# and recomputes `records` from it every time, so the file always wins.
file: dns/example.com.zone
