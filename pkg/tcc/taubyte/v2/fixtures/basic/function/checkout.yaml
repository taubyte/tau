id: QmNf1SA5DVFbNTVYYPvKqTLLYzGqPZAmtLqYmYnFCEcvLh
description: takes an order and charges it
runtime: wasm
source:
    component: paylib
execution:
    call: checkout
    timeout: 20s
    memory: 32MB
cache:
    orders:
        ops: [get, put]
        timeout: 200ms
    sessions:
        namespace: /shop
        ops: [get]
storage:
    receipts:
        ops: [put]
secret:
    stripe:
        ops: [get]
stream:
    orders:
        ops: [publish]
database:
    tokens:
        ops: [get, put]
sync:
    audit:
        ops: [append]
workflow:
    checkout:
        ops: [start]
channel:
    reserve:
        ops: [dial]
    sync:
        ops: [dial]
regions:
    pinned: [region-1]
