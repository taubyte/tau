id: QmXnnyufdzAWL5CqZ2RnSNgPbvCc1ALT73s6epPrRnZ1Zb
description: reserve the stock, then charge. a failed charge lands in checkout_failed for a person - putting the stock back automatically is a compensation branch, which a line cannot hold
start: reserve
timeout: 1h
concurrency: 50
steps:
    - name: reserve
      call:
          function: reserve_stock
          input: order.lines
          result: reservation
      attempts: 4
      backoff:
          interval: 5s
          factor: 2
          ceiling: 1m
    - name: settle
      wait: 30s
    - name: charge
      call:
          function: charge_card
          input: reservation
      attempts: 1
