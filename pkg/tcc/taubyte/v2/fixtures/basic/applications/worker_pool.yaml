id: QmRZ8XwnqQzhLTPnbTZWpqAqLmv5qJpsKHYS8FfKCYPYuK
description: a container queue consumer - it has no host ABI, so each item is POSTed to a port it declared
image: "ghcr.io/acme/pool:2.1"
ports:
    work: 8080
health:
    function:
        name: pool_ready
execution:
    memory: 256MB
limits:
    max-instances: 4
    concurrency: 1
queues:
    orders:
        ops: [receive]
        deliver:
            port: work
            path: /work
