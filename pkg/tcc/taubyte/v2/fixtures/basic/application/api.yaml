id: QmVUyCkPnH4TfoyRmnAXPzGZ4PGwVJ9wJTvGXFqSaYbnGF
description: the storefront api; two listening ports, named so nothing repeats a number
package:
    name: api_image
ports:
    http:
        number: 8080
    metrics:
        number: 9090
readiness:
    http:
        port: http
        path: /healthz
liveness:
    http:
        port: http
        path: /livez
    failures: 5
execution:
    memory: 512MB
limits:
    max_instances: 10
    concurrency: 80
variables:
    LOG_LEVEL:
        value: info
    REGION:
        value: region-1
regions:
    failover:
        main: region-1
        standby: region-2
egress: [api.stripe.com]
cache:
    orders:
        ops: [get, put]
secret:
    stripe:
        ops: [get]
