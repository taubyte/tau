id: QmRZ8XwnqQzhLTPnbTZWpqAqLmv5qJpsKHYS8FfKCYPYuK
description: a container queue consumer built from this repository - ready when the pool says so; nothing restarts it, so it declares no liveness
source: services/pool
build:
    dockerfile:
        path: Dockerfile
        target: runtime
ports:
    work:
        number: 8080
readiness:
    function:
        name: pool_ready
execution:
    memory: 256MB
limits:
    max_instances: 4
    concurrency: 1
queue:
    orders:
        ops: [receive]
        deliver:
            port: work
            path: /work
