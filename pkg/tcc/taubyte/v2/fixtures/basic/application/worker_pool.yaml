id: QmRZ8XwnqQzhLTPnbTZWpqAqLmv5qJpsKHYS8FfKCYPYuK
description: a container queue consumer - ready when the pool says so; nothing restarts it, so it declares no liveness
image: "ghcr.io/acme/pool:2.1"
ports:
    work:
        number: 8080
readiness:
    function:
        name: pool_ready
execution:
    memory: 256MB
limits:
    max-instances: 4
    concurrency: 1
queue:
    orders:
        ops: [receive]
        deliver:
            port: work
            path: /work
