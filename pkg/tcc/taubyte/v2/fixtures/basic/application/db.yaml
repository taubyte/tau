id: QmSgvGwXHLPnCXKTPnbTZWpqAqLmv5qJpsKHYS8FfKCYPY
description: postgres - nothing about it is http, so no gateway can reach it
image: "ghcr.io/acme/postgres:16"
ports:
    pg:
        number: 5432
readiness:
    http:
        port: pg
        path: /
image_pull_secret:
    name: stripe
volume:
    pgdata:
        ops: [mount-rw]
        path: /var/lib/postgresql/data
execution:
    memory: 2GB
    cpu: 2000
limits:
    max-instances: 1
