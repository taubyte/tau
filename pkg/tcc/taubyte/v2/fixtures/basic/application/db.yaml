id: QmSgvGwXHLPnCXKTPnbTZWpqAqLmv5qJpsKHYS8FfKCYPY
description: postgres - nothing about it is http, so no gateway can reach it
source:
    image: "ghcr.io/acme/postgres:16"
    image_pull_secret:
        name: stripe
ports:
    pg:
        number: 5432
readiness:
    http:
        port: pg
        path: /
volume:
    pgdata:
        ops: [mount-rw]
        path: /var/lib/postgresql/data
execution:
    memory: 2GB
    cpu: 2000
limits:
    max_instances: 1
