id: QmNf1SA5DVFbNTVYYPvKqTLLYzGqPZAmtLqYmYnFCEcvLh
description: takes an order and charges it
source: module/paylib
execution:
    call: checkout
    timeout: 20s
    memory: 32MB
caches:
    orders:
        ops: [get, put]
        via:
            name: paid_tier
        timeout: 200ms
    sessions:
        namespace: /shop
        ops: [get]
storages:
    receipts:
        ops: [put]
secrets:
    stripe:
        ops: [get]
messaging:
    orders:
        ops: [publish]
