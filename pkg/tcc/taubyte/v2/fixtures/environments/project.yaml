name: v2envs
description: several deployments - the table, a shadow inside one, and the keys a document suffixes for them
environments:
    production:
        branches: [main, master]
        regions: [region-1, region-2]
        shadows:
            # its own release over production's state, so no regions of its own to place
            ab:
                branches: [main]
    staging:
        branches: ["release/*"]
        regions: [region-3]
    preview:
        branches: ["*"]
