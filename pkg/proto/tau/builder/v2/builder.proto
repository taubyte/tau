syntax = "proto3";

// builder's p2p surface: what plm asks the private service that runs a
// repository's code (.notes/v2/build-topology.md). A builder serves it on
// /tau/builder/v2 over p2p and faces nothing else; plm finds builders by that
// protocol through p2p discovery and hands each one run at a time.
//
// A RUN'S LOG LIVES ON ITS BUILDER. The builder writes it as the run goes and keeps
// it until plm seals it, so a follower reaches it through plm, which reads
// from the job record which builder holds the run and proxies Follow there.
package tau.builder.v2;

import "tau/plm/v2/plm.proto";

service BuilderService {
  // Plan reads which environments a pushed commit feeds. A builder already running
  // something answers Unavailable, and plm asks another.
  rpc Plan(Work) returns (Planned);

  // Build builds one environment, and answers once the run has ended. The run's
  // log stays open on this builder until Seal.
  rpc Build(Work) returns (Built);

  // Cancel stops a run this builder holds; its Plan or Build then answers as the
  // run ended. A run it does not hold is nothing to stop.
  rpc Cancel(Run) returns (tau.plm.v2.Empty);

  // Seal ends a run's log with how build settled the job, and keeps the log in the
  // storage service. A plan's log is not kept, nor a discarded one, and either seals
  // with no cid.
  rpc Seal(Sealing) returns (Sealed);

  // Follow streams a run's log from an offset, to its seal, or with snapshot to
  // what it holds now. A sealed log is still followed whole for a while after its
  // seal; a run this builder holds no log of is NotFound.
  rpc Follow(tau.plm.v2.FollowRequest) returns (stream tau.plm.v2.Job.Event);
}

// Work is everything a run is given, derived by build from the job record and
// never from the webhook.
message Work {
  string job_id = 1;
  string repository_key = 2;
  string ref = 3;
  string commit_sha = 4;
  // before is the last commit build finished for this (repository, ref), from its
  // own history; empty is a full build.
  string before = 5;
  string project_id = 6;
  uint32 attempt = 7;
  // environment is the deployment a build builds, empty for a plan.
  string environment = 8;
  // prelude is what the plan said, which opens a build's log.
  string prelude = 9;
  // within is how long the run may take, in nanoseconds from when it is handed: its
  // claim's deadline less the claim's margin. Zero is unbounded.
  int64 within = 10;
}

// Run names one run of a job.
message Run {
  string job_id = 1;
  uint32 attempt = 2;
}

// Planned is how a plan ended: error empty is a success.
message Planned {
  string error = 1;
  repeated string environments = 2;
  // said is what the plan wrote, which opens each environment job's log.
  string said = 3;
}

// Built is how a build ended: error empty is a success, anything else is the
// build's failure in its own words. stored is what it kept either way.
message Built {
  string error = 1;
  repeated Stored stored = 2;
}

// Stored is one artifact of a run, kept: the builder puts it in the storage
// service itself, so its bytes never cross build.
message Stored {
  string resource_id = 1;
  string cid = 2;
  uint64 bytes = 3;
}

// Sealing is the status build settled a run's job with, the log's last event.
message Sealing {
  Run run = 1;
  tau.plm.v2.JobStatus status = 2;
  // discard is a run whose log nothing will name: its job went, moved on before the
  // run ended, or the run was abandoned. It is ended and not kept.
  bool discard = 3;
  // said is plm's own lines about the run, written before the status: the jobs a
  // plan queued, or why plm failed it.
  repeated string said = 4;
}

// Sealed is a run's log as the storage service keeps it: no cid is a log that
// was not kept.
message Sealed {
  string log = 1;
  uint64 bytes = 2;
}
