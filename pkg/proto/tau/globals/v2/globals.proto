syntax = "proto3";

// The globals service's surface between tau nodes, over p2p/rpc: what the
// cloud holds once for every region. Certificates are the first of it.
//
// A globals node keeps the cloud's certificate chains, one record per
// issuance; the private key of each is in the secrets service. Any node that
// needs a certificate orders it itself, keeps it here, and reads the newest
// one back.
package tau.globals.v2;

service CertificateService {
  // Certificate is the newest unexpired certificate kept for a name.
  rpc Certificate(CertificateRequest) returns (Issued);

  // Keep stores one issuance beside the others kept for its name.
  rpc Keep(Issued) returns (Empty);
}

message Empty {}

message CertificateRequest {
  // name is a DNS name, or `*.` and one, lowercase and without a trailing dot.
  string name = 1;
  reserved 2;
}

// Issued is one certificate as kept.
message Issued {
  string name = 1;
  // chain is the leaf first, PEM.
  bytes chain = 2;
  // key names the secret holding the leaf's private key, PEM.
  SecretRef key = 3;
  // not_after is the leaf's expiry, unix seconds.
  int64 not_after = 4;
}

message SecretRef {
  string project = 1;
  string environment = 2;
  string name = 3;
}
