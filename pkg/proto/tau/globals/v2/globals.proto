syntax = "proto3";

// The globals service's surface between tau nodes, over p2p/rpc: what the
// cloud holds once for every region. Certificates are the first of it.
//
// A globals node issues from an ACME CA and keeps what it issued: the
// chain in its own database, the private key in the secrets service. A node
// serving TLS asks one for a name's chain and the secret holding its key, and
// opens the key from the vault itself. A dns node asks for the DNS-01 answers
// of a name, and a gateway for the HTTP-01 answer to a token.
package tau.globals.v2;

service CertificateService {
  // Certificate is the newest certificate kept for a name. With issue set, a
  // name nothing is kept for is issued now, by the node answering.
  rpc Certificate(CertificateRequest) returns (Issued);

  // KeyAuthorization is the HTTP-01 answer for a token the answering node's
  // order is proving right now. It is asked of the node that placed the order
  // and not derived from an account thumbprint, because two nodes that both
  // minted an account before either saw the other's hold different ones.
  rpc KeyAuthorization(KeyAuthorizationRequest) returns (KeyAuthorizationValue);

  // Challenges are the TXT values a dns node answers for
  // `_acme-challenge.<fqdn>` while an order for fqdn is being proved.
  rpc Challenges(ChallengesRequest) returns (ChallengeValues);
}

message Empty {}

message CertificateRequest {
  // name is a DNS name, or `*.` and one, lowercase and without a trailing dot.
  string name = 1;
  bool issue = 2;
}

// Issued is one certificate as kept.
message Issued {
  string name = 1;
  // chain is the leaf first, PEM.
  bytes chain = 2;
  // key names the secret holding the leaf's private key, PEM.
  SecretRef key = 3;
  // not_after is the leaf's expiry, unix seconds.
  int64 not_after = 4;
}

message SecretRef {
  string project = 1;
  string environment = 2;
  string name = 3;
}

message KeyAuthorizationRequest {
  string token = 1;
}

message KeyAuthorizationValue {
  // found is false when no order of the answering node is proving the token.
  bool found = 1;
  string value = 2;
}

message ChallengesRequest {
  // fqdn is the name being proved, without `_acme-challenge.`.
  string fqdn = 1;
}

message ChallengeValues {
  repeated string values = 1;
}
