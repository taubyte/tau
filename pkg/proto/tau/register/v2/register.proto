syntax = "proto3";

// register is where a compiled project lives and what the runtime reads.
//
// v1 called this tns. The name said name resolution; the job is holding what
// has been published and answering lookups, which is a register.
//
// THE WHOLE SURFACE IS THREE CALLS, AND THE SPLIT BETWEEN THEM IS THE DESIGN.
//
// A compiled project is IMMUTABLE and named by its content, so an id names one
// object for all time and a reader that has fetched one may keep it forever. A
// POINTER is what moves: one per (project, environment), small, and the only
// thing a hot reader has to re-read.
//
//   Publish      — the build backend, after tcc compiled the user's config
//   Resolve      — the runtime, asking which object an environment runs now
//   Object       — the runtime, once, the first time it sees an id
//   ResolveHost  — a gateway, asking whose name a request just arrived for
//   ResolveView  — a destination, asking which object it holds of a deployment
//   Assigned     — a destination, asking which deployments it holds a view of
//
// A DEPLOYMENT IS CUT INTO VIEWS, one per destination: the part of the whole
// object one place holds. Each revision's views and the whole object are named
// by a manifest, itself an immutable object, and a destination reads only its
// own view. See pkg/register's views.go.
//
// So Resolve returns a POINTER and not an object. Returning the object would
// be correct and would also move a whole compiled project across the wire on
// every read, forever, to answer a question whose answer usually did not
// change. See pkg/register's package doc for the same argument at length.
//
// WHO A PROJECT IS IS NOT HERE: which repositories claim an id, and who may act
// on it, is auth's project table (tau/auth/v2's ProjectService). The register
// holds what a project compiled to, and nothing about who it belongs to.
//
// NOTHING ENUMERATES. There is no List of projects, no List of
// environments and no history. Every call names exactly one row, which is what
// the runtime needs; an operator's "what is deployed" question is a different
// surface with different trust properties, and inventing it here would put a
// full-store scan behind a call any peer can make.
//
// WHAT IS INSIDE AN OBJECT IS NOT MODELLED. `compiled` is tcc's output and
// this schema does not parse it. A register that understood the vocabulary
// would change every time the vocabulary did, and every consumer would then be
// reading the register's idea of the schema instead of the schema.
//
// AUTHORIZATION IS NOT HERE. Any peer that can reach this service can publish,
// which is the OSS trust model — the swarm's members are the trust boundary
// and a certificate from the cloud's CA is what enforces it. A deployment that needs to
// distinguish between its own peers needs a caller identity on every request
// and an answer to "who may move this pointer"; that is a real design, not a
// field, and it is not guessed at here.
package tau.register.v2;

// Pointer is what one environment of one project currently runs.
message Pointer {
  // object is the content address of the compiled project in force: the hex
  // sha256 of its bytes.
  string object = 1;

  // revision is the deploy counter, and it only ever increases.
  //
  // A publish carrying a revision no higher than the one held is REFUSED, and
  // that refusal is the whole reason this field crosses the wire. Two
  // consequences, both wanted: a publish that arrives late — a retry, a node
  // catching up — cannot roll an environment back to code somebody already
  // replaced; and a rollback is an ordinary publish of the previous object
  // under a NEW revision, so "go back to what we ran on Tuesday" is a forward
  // operation that leaves a trail.
  uint64 revision = 2;
}

message PublishRequest {
  string project = 1;
  string environment = 2;
  uint64 revision = 3;

  // compiled is tcc's output, opaque here.
  bytes compiled = 4;

  // hosts are the fully-qualified names this environment answers on, and they
  // are DECLARED rather than derived.
  //
  // The register does not read the compiled object, so it cannot work a name
  // out — and it could not anyway: a name is the label a resource chose, the
  // zone that answers for it, and for a generated one the cloud's own fqdn,
  // which is not in the config at all. Whoever publishes knows all three.
  //
  // FIRST CLAIM WINS. A name another project already answers on is refused,
  // because two projects can both write `shop.example.com` and whichever
  // deployed second would otherwise take the first one's traffic. A republish
  // keeps what it still lists and releases what it dropped, so a renamed
  // gateway does not hold its old name forever.
  repeated string hosts = 5;

  // views is each destination's object of this revision, opaque here as
  // compiled is.
  repeated View views = 6;

  // cut says the publisher cut this revision into views, so an empty views
  // list is a deployment cut for no destination. Unset, the revision is
  // published whole: every destination reads compiled.
  bool cut = 7;
}

// View is one destination's object.
message View {
  string destination = 1;
  bytes compiled = 2;
}

message ViewRequest {
  string project = 1;
  string environment = 2;
  string destination = 3;
}

// ViewPointer is what one destination of one deployment runs now.
message ViewPointer {
  string object = 1;
  uint64 revision = 2;
  // manifest is the revision's manifest, naming the whole object beside it.
  string manifest = 3;
}

// DeploymentManifest is one revision of one deployment. whole is a publication nobody
// cut; views is each listed destination's object.
message DeploymentManifest {
  string project = 1;
  string environment = 2;
  uint64 revision = 3;
  string object = 4;
  bool whole = 5;
  map<string, string> views = 6;
  // id is the manifest's own content address.
  string id = 7;
}

message DestinationRequest {
  string destination = 1;
}

message Assignment {
  string project = 1;
  string environment = 2;
  ViewPointer view = 3;
}

// Assignments is every deployment a destination holds a view of now. A
// destination's deployments are bounded by what is placed there, so a list.
message Assignments {
  repeated Assignment assignments = 1;
}

message PublishResponse {
  // object is the content address the compiled bytes landed under. Publishing
  // the same configuration twice returns the same id, which is how a caller
  // can tell a redeploy from a change without diffing anything.
  string object = 1;
}

message ResolveRequest {
  string project = 1;
  string environment = 2;
}

message ObjectRequest {
  // object is the content address, as returned by Publish or named by a
  // Pointer.
  string object = 1;
}

// CompiledProject carries the bytes. It is named for what it holds rather
// than "Object" because a message may not share a name with an RPC in the same
// package, and the RPC is the one whose name a caller reads.
message CompiledProject {
  bytes compiled = 1;
}

message ProjectRequest {
  string project = 1;
}

// Deployments is which environments of a project have ever been published.
//
// A LIST AND NOT A STREAM. A project's deployments are the handful its author
// declared — production, staging, preview, a shadow or two — not a population
// that grows with use, so a stream would be ceremony around a slice that
// always fits in one message.
message Deployments {
  repeated string environments = 1;
}

message HostRequest {
  string fqdn = 1;
}

message HostAnswer {
  string project = 1;
  string environment = 2;
}

service RegisterService {
  // Publish stores a compiled project and points an environment at it.
  rpc Publish(PublishRequest) returns (PublishResponse);

  // Resolve answers which object an environment runs, and under which
  // revision. This is the read on the request path.
  rpc Resolve(ResolveRequest) returns (Pointer);

  // Object is one compiled project by its content address. A caller makes this
  // call once per id and never again.
  rpc Object(ObjectRequest) returns (CompiledProject);

  // Environments is which deployments a project has, sorted.
  //
  // IT IS WHAT A CODE BUILD ASKS FIRST. A push to a code repository knows a
  // project and a branch; which deployments that branch feeds is in the
  // compiled object, and reading the compiled object needs the name of a
  // deployment to read it from.
  //
  // A project nobody has published answers with an empty list rather than
  // NotFound: the question has an answer and the answer is none.
  rpc Environments(ProjectRequest) returns (Deployments);

  // ResolveHost says whose environment answers on a name. It is the first thing
  // a gateway does with a request, before it can match a route or reach
  // anything.
  //
  // It answers with an ADDRESS and not a route: what the name serves is in the
  // compiled object, which the caller fetches once and keeps. A register that
  // returned routes would be a register that parsed the vocabulary.
  rpc ResolveHost(HostRequest) returns (HostAnswer);

  // ResolveView answers which object a destination holds of a deployment: the
  // newest revision whose view has arrived. A destination the current revision
  // does not list is NotFound with the no-view message, unlike a deployment
  // nobody published.
  rpc ResolveView(ViewRequest) returns (ViewPointer);

  // Assigned is every deployment a destination holds a view of now, read from
  // the destination's own index rather than from every project.
  rpc Assigned(DestinationRequest) returns (Assignments);

  // Manifest is a deployment's current revision: its whole object and every
  // destination it lists. A deployment nobody published is NotFound.
  rpc Manifest(ResolveRequest) returns (DeploymentManifest);

  // Watch is a session a reader binds the answers it caches to. A read sent with
  // the session and an entry of the reader's choosing is bound when its answer
  // comes back marked so: the register then names that entry on this stream,
  // once, when anything the answer was read from changes, here or by a merge from
  // another node. The stream opens with the session and its limits and beats while
  // nothing changes, so a reader can tell a quiet register from a gone one. A
  // reader keeping answers from more than one node holds one session on each.
  rpc Watch(WatchRequest) returns (stream WatchEvent);

  // Forget releases entries a reader no longer keeps. An entry that changed is
  // already released.
  rpc Forget(ForgetRequest) returns (ForgetResponse);
}

message WatchRequest {}

message WatchEvent {
  oneof event {
    WatchReady ready = 1;
    WatchChanged changed = 2;
    WatchBeat beat = 3;
  }
}

// WatchReady opens a session: its id, how many entries it may hold bound at once,
// and how often it beats.
message WatchReady {
  string session = 1;
  uint32 max_entries = 2;
  uint32 beat_ms = 3;
}

// WatchChanged is entries whose answers may have changed. Each is released.
message WatchChanged {
  repeated uint64 entries = 1;
}

message WatchBeat {}

message ForgetRequest {
  string session = 1;
  repeated uint64 entries = 2;
}

message ForgetResponse {}
