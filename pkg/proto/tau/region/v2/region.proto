syntax = "proto3";

// The contract between the regions of one cloud. Each region runs its own cm, and
// that cm is the region's end of the link: a service hands its cm what has to be
// answered in another region, cm hands it to the link, and the cm at the far end
// checks it against its own release before anything runs there.
//
// The link is the deployment's own: this file says what crosses it and nothing
// about how it travels.
package tau.region.v2;

import "tau/worker/v2/worker.proto";

service RegionService {
  // Carry hands one call to the first region named that can be reached. A region
  // that is reached and refuses ends it: the next one is tried only when this one
  // could not be reached.
  rpc Carry(CarryRequest) returns (Answered);
}

message CarryRequest {
  // to is every region that can answer, in the order the caller's routing names
  // them.
  repeated string to = 1;
  Carried carried = 2;
}

// Carried is what crosses the link: one call, and what it was routed under.
message Carried {
  // release is the whole compiled object the caller routed by. A region answers
  // only while it serves the same one.
  string release = 1;

  // id names this call wherever it is logged, on both sides of the link.
  string id = 2;

  oneof call {
    Origin origin = 3;
  }
}

// Origin is a request a gateway route makes of a handler its own region does not
// run, after the route's guard and transformers ran where it was received.
message Origin {
  // route is the gateway resource whose route reaches the handler: the region
  // answering checks that its release has that route, reaching that handler.
  tau.worker.v2.Target route = 1;

  // request names the handler and carries the request as the route shaped it.
  tau.worker.v2.InvokeRequest request = 2;
}

message Answered {
  // region is the one that answered.
  string region = 1;
  tau.worker.v2.InvokeResponse response = 2;
}
