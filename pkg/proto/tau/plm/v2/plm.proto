syntax = "proto3";
// plm's inter-service RPC surface. v1's patrick (webhook + job store) and monkey
// (CI builder) become two v2 services on either side of a trust boundary
// (.notes/v2/build-topology.md): `plm`, public, which takes webhooks and the job
// API off the internet and OWNS THE QUEUE AND THE JOB RECORDS; and `builder`,
// private, N of them, which hold no state and run what plm hands them. Public
// and dangerous are different axes: plm is exposed to hostile INPUT, a builder to
// hostile CODE (a repository's build.sh), so consensus stays off the machine that
// runs it.
//
// EVERY RPC BELOW IS SERVED BY PLM, on /tau/plm/v2: QueueService and JobService
// answer plm's own HTTP routes on whichever plm node leads the queue. A builder
// serves its own protocol (tau/builder/v2/builder.proto), which plm calls to run a
// job and proxies a follower's Follow to.
//
// ONE PACKAGE, SEVERAL `service` BLOCKS, as auth.proto does: a node's protocol id
// is derived from the package (`tau.plm.v2` -> `/tau/plm/v2`), and the blocks
// are facets of one job lifecycle — created through QueueService, observed and
// administered through JobService.
//
// IDENTITY, as in auth.proto: a repository is named by its canonical clone-URL key
// alone (pkg/git/repokey: host/owner/name), never a provider-native or numeric id,
// and a clone URL is never carried — see PushEvent.
//
// THE QUEUE IS A TRUST BOUNDARY: every field QueueService.Enqueue accepts
// originates in a webhook delivered off the internet, so the crossing is small and
// typed rather than a copy of whatever shape the provider's payload has. PushEvent
// argues it in place. JobService's calls carry a job or project id an
// authenticated caller was already handed, and who that caller is is plm's
// authorization, never a field here.
//
// STREAMING, as in auth.proto: List is server-streaming because it enumerates an
// unbounded store; Follow streams a run's events. Every other RPC is a single
// lookup or mutation and stays unary.
package tau.plm.v2;

// Empty is the response for a call whose only interesting outcome is
// whether it errored — see auth.proto's Empty for the reasoning, not
// repeated per file.
message Empty {}

// ─────────────────────────────── Queue ───────────────────────────────

// PushEvent is what a verified push becomes when it crosses into the queue,
// and it is the ONLY message in this file whose
// fields originate, even indirectly, in a webhook payload. Three fields,
// by deliberate and argued exclusion of everything else v1's cbor `Meta`
// carried (v1's core/services/patrick/types.go):
//
//   - `repository_key` — pkg/git/repokey's canonical identity, parsed by
//     plm's webhook handler from the payload's repository URL. Never the
//     numeric `Repository.ID` v1 sent instead: a builder re-derives clone
//     access for this key from the deploy key its link stored in the vault,
//     not from a URL or a credential plm hands it. `repository_key` alone is also
//     enough to reconstruct a clone address, because it already contains
//     the host that serves the repository — carrying a separate clone URL
//     across this boundary would only ever agree with the key or lie about
//     it, the identical argument auth.proto makes against a `provider`
//     field beside a repository key.
//   - `ref` — the pushed git ref, e.g. "refs/heads/main". Branch-eligibility
//     policy (v1's check against legacy/specs/common's `DefaultBranches`,
//     `main`/`master`) is decided at plm's webhook handler before Enqueue
//     is ever called: a push to an ineligible ref is refused there and never
//     reaches this RPC. So `ref` here already passed that policy — it is not
//     raw material for a builder to re-filter.
//   - `commit_sha` — the pushed HEAD. v1 carried this twice (`Meta.After`
//     and `Meta.HeadCommit.ID`), collapsed to one field here: a push event
//     carries them equal, and two fields that must always agree are one
//     fact spelled twice, the same objection auth.proto raises against a
//     redundant `provider` field.
//
// NOT HERE, on D5's explicit ruling (service-topology.md §5): the payload's
// per-commit `commits[].added|modified|removed` list — provider-shaped,
// truncates past 20 commits or 3000 files in GitHub's own payload, and
// forwarding it would hand a builder's path-filter logic data shaped by
// an internet-facing listener instead of by the repository itself. `before`
// is not carried either, and not merely as a smaller version of the same
// caution: it is exactly as webhook-supplied as `commit_sha` is, so
// carrying it would not have bought back any trust `commit_sha` alone
// lacks. Instead a builder computes its own before..after diff AFTER the
// clone: `commit_sha` is `after`, and `before` is whatever commit sha build
// last finished for this exact (repository_key, ref) — read from plm's own
// job history and handed down in the builder's Work.before, never from the webhook. A ref
// with no prior processed commit has no `before` to diff against and is
// built in full, exactly what a GitHub payload's all-zero
// `before` signals today for a newly created branch.
//
// One consequence worth stating rather than leaving implicit: v1's job id
// (`PushEventJobID`) folds in `Repository.PushedAt` specifically so a
// redelivered webhook for the same push still dedupes while two distinct
// pushes that happen to land on the same commit do not collide. `PushedAt`
// does not cross this boundary either, on the same D5 reasoning — and
// losing it is not a loss: two pushes landing on the same (repository_key,
// ref, commit_sha) have nothing different to build, since a build is a
// function of that triple and nothing else. Deduplicating them is correct,
// not merely tolerated, and QueueService.Enqueue below relies on exactly
// that.
message PushEvent {
  string repository_key = 1;
  string ref = 2;
  string commit_sha = 3;
}

// QueueService.Enqueue is the crossing that carries a STRANGER'S bytes —
// not the only crossing, which is JobService's four as well (see the header),
// but the only one whose arguments an unauthenticated POST decides. That is
// the reason PushEvent's doc comment states, at length, everything it
// deliberately does not carry: this single RPC is what
// the plm/builder split is drawn around.
// Keeping it to one small message and one small method is what makes that
// boundary auditable by reading this file, rather than something a
// reviewer has to reconstruct by diffing two structs that happen to share
// most of their fields.
//
// This service carries no queue READ or CLAIM operation (v1's
// `dequeue`/`isAssigned`/`timeout` p2p actions). PLM claims in-process, on
// the node leading the "plm/queue" raft group — claim, visibility timeout
// and dead letter are the queue's own — and hands a claimed job to a builder
// through the builder's own protocol. A builder never claims; it is handed.
service QueueService {
  // Enqueue durably records a push and returns its job id. Idempotent: a
  // redelivered webhook for the same push (repository_key, ref, commit_sha)
  // returns the existing job's id rather than creating a second one,
  // matching v1's services/patrick/github.go's `if existing, err := ...; err ==
  // nil { return existing, nil }` — and, per PushEvent's doc comment,
  // correctly so, since there is nothing different to build.
  rpc Enqueue(PushEvent) returns (JobRef);
}

// ──────────────────────────────── Jobs ────────────────────────────────

// JobStatus mirrors v1's core/services/patrick.JobStatus with one rename.
// v1's zero value is JobStatusOpen (`iota - 1` starting at JobStatusFailed
// = -1, which proto3 cannot express as an enum's required zero value
// anyway), kept at 0 here too so a zero-value Job reads as "queued", never
// as a status that already happened.
enum JobStatus {
  JobStatusOpen = 0;
  // Claimed: plm has popped this job off the queue and a builder is
  // running it. v1 names this JobStatusLocked; renamed to match the
  // claim/visibility-timeout vocabulary the raft `queue` kind specifies
  // (cluster-service.md §2, services-are-rewritten.md §5) — "locked"
  // described v1's hand-rolled dequeue-then-write-an-/assigned/-row dance
  // (v1's services/patrick/api.go's dequeueHandler); "claimed" is what the same
  // state is called in the mechanism replacing it.
  JobStatusClaimed = 1;
  JobStatusSuccess = 2;
  JobStatusFailed = 3;
  JobStatusCancelled = 4;
}

message JobRef {
  string id = 1;
}

// Job is not v1's cbor Job (core/services/patrick/types.go): its
// `Repository` carries `repository_key` in place of the numeric
// `Repository.ID`/deprecated `SSHURL`, per decision 3. `project_id` is
// deliberately absent, matching v1 exactly: v1 never stored it on the job
// either, only in a separate `/by/project/<id>/<jid>` index plm keeps
// privately — a project is how a caller finds a job (see List
// below), not a field of the job itself.
message Job {
  string id = 1;
  JobStatus status = 2;
  string repository_key = 3;
  string ref = 4;
  string commit_sha = 5;
  // Unix seconds. v1's Job.Timestamp.
  int64 timestamp = 6;
  // attempt counts the runs this job has had: each claim is the next one, and
  // a retry does not start it again. A queued job's next run is attempt + 1.
  int32 attempt = 7;
  // The cid of each run's log, keyed by that run's attempt as zero-padded
  // decimal, so the keys sort in run order. A run whose log was not kept — its
  // node went away, or the asset store would not take it — has no entry, and
  // a later run's entry is not its log.
  map<string, string> logs = 8;
  // Keyed by resource id (a function/website/library/... within the
  // pushed project) -> the built artifact's cid, matching v1's Job.SetCid
  // (v1's services/monkey/jobs/helpers.go's handleCompressedBuild) and what
  // v1's HTTP `/download/{jobId}/{resourceId}` route reads back by that
  // same resource id.
  map<string, string> asset_cid = 9;
  // environment is the one deployment this job builds. Empty is the plan job a
  // push makes first: it reads which environments the pushed commit feeds and
  // enqueues one job for each, named in children.
  string environment = 10;
  repeated string children = 11;
  // reason is why a job failed, empty otherwise.
  string reason = 12;

  // Event is one thing that happened to one run of a job, as a follower sees it:
  // the run's status as it moves, and each line of its output. A follower reads
  // until a terminal status.
  message Event {
    // at is unix nanoseconds, by the clock of the node that served it.
    int64 at = 1;
    oneof kind {
      JobStatus status = 2;
      // message is one line of the run's output, without its newline.
      string message = 3;
    }
    // offset is where a follower that lost the stream asks again from: the byte
    // of the run's log after this event. IT IS CARRIED, not counted by the
    // follower, because the two disagree the moment a follower drops an event it
    // could not write, and a resume from a count that lost one skips it.
    int64 offset = 4;
  }
}

message ProjectRef {
  string id = 1;
}

// JobService answers what plm's token-authenticated HTTP job API needs from
// the node leading the queue, which is where every job record is written.
//
// Cancel and Retry are each ONE RPC where v1 needed a round trip between
// two services to do the equivalent thing, and stating why is worth doing
// once, here, rather than leaving it to be rediscovered:
//
//   - v1's cancel is a three-hop dance: the HTTP handler
//     (v1's services/patrick/api.go's cancelJob) reads which monkey is assigned,
//     calls that monkey's OWN p2p service to stop it
//     (v1's clients/p2p/monkey's Cancel), and monkey — separately — reports back
//     to patrick with the accumulated logs so patrick can write
//     JobStatusCancelled (v1's services/monkey/api_monkeys.go's cancelHandler
//     calling `m.patrickClient.Cancel(jid, monkey.Job.Logs)`). That
//     round trip exists only because monkey held the run and patrick the
//     record. In v2 plm holds the record and reaches the builder holding the
//     run, so stopping the run (the builder's Cancel) and writing the terminal
//     status are one call; Cancel(JobRef) returns (Empty) is the whole
//     surface, and no log payload crosses because the builder keeps the log.
//     A plm node that does not lead forwards with this SAME RPC to the one
//     that does — one plm node calling another, not a second method.
//   - Retry returns Empty, not the job's id: v1's retryJob
//     (v1's services/patrick/api.go) always re-queues the SAME id it was given
//     and returns exactly that id back — `{"retry": jid}` — which the
//     caller already sent as the request. Echoing it back is the identical
//     redundancy auth.proto's RepositoryService.Register comment argues
//     against for its own response, and the fix is the same one: return
//     Empty, because success/failure is the only fact this call can tell
//     the caller that it did not already know.
// FollowRequest asks for a running build's output.
//
// THE OFFSET IS WHY THIS IS NOT A DOWNLOAD. A log is written while it is read,
// so a viewer joining late resumes at 0 and catches up, and one whose
// connection dropped resumes at the offset it had and misses nothing in
// between. v1 has no equivalent: patrick can hand over a log only once the
// build has ended and the whole of it has reached IPFS, so "watch this build"
// was not a thing that could be asked for.
//
// It is a BYTE offset and not a line or a record number, because that is what
// livelog's Reader takes and translating between the two would put a second
// idea of "where am I" on the wire.
message FollowRequest {
  string job_id = 1;
  // offset to resume from. Zero is the beginning of this attempt's log.
  int64 offset = 2;
  // snapshot ends the stream at what the log holds when the request arrives
  // instead of when the build ends: what has been logged so far, as
  // `docker logs` reads without -f.
  bool snapshot = 3;
  // attempt is the run whose log `offset` is in — Job.attempt as that run
  // was claimed — and it is required. AN OFFSET IS A POSITION IN ONE RUN'S
  // LOG: a job that runs again, because its node went away or because it was
  // retried, writes a new log from byte zero, and an offset carried over to it
  // would splice the new run's bytes onto the old one's. So a node writing
  // another run's log answers as if it held none.
  int32 attempt = 4;
}


// ArtifactRequest asks what one resource of one deployment currently runs.
message ArtifactRequest {
  string project = 1;
  string environment = 2;
  string resource = 3;
}

// Built is what a resource currently runs.
//
// The message is not called Artifact because the rpc below is, and a message
// may not share a name with a method of the service that returns it —
// register.proto's CompiledProject is the same rename for the same reason.
message Built {
  // cid is the content id of what the last successful build of that resource
  // produced.
  string cid = 1;
}

service JobService {
  rpc Get(JobRef) returns (Job);
  rpc List(ProjectRef) returns (stream JobRef);
  rpc Cancel(JobRef) returns (Empty);
  rpc Retry(JobRef) returns (Empty);

  // Artifact is the content id of what one resource of one deployment
  // currently runs.
  //
  // IT IS A ROW AND NOT A SEARCH. The row is written in the same replicated
  // entry as the record of the build that produced it, so "this job succeeded"
  // and "this is what that deployment now runs" cannot end up disagreeing — and
  // a reader pays one read rather than a walk over a project's job history
  // looking for the newest one that built this resource.
  //
  // ONLY A SUCCESSFUL BUILD MOVES IT. A failed run's log is kept, because that
  // is the output somebody wants; what a deployment RUNS must not become
  // something a build failed to finish.
  //
  // A resource nothing has built answers NotFound. That is not the same as a
  // resource that needs no build — an image is pulled, a component is built as
  // its own resource — and the caller is the one that knows which it asked
  // about.
  rpc Artifact(ArtifactRequest) returns (Built);

  // Follow streams one RUN's events, from `offset` to the end of it — or, with
  // `snapshot`, to the end of what it has written so far: its status as it starts,
  // each line of its output, and, for a follow, the status the run left the job
  // in once that has settled, which is the stream's last event.
  //
  // A RUN'S LOG IS ON ITS BUILDER, and any plm node answers by proxying there:
  // the job record names the builder holding each run (JobClaimed.builder). A run
  // that has not started — the job is queued, or claimed with no builder named yet
  // — is waited for until the record names one or the job ends without it. The
  // builder answers until plm seals the run, which writes the settled status as
  // the log's last event. A builder that cannot be reached is Unavailable.
  //
  // A RUN THAT HAS ENDED IS NOT ON ITS BUILDER once plm has sealed it and the
  // builder let go. What survives it is a content id on the job record (Job.logs,
  // under its attempt), and reading one back is the asset store's business — so
  // a run that has ended is FailedPrecondition: the job finished, or ran again.
  // Not an empty stream that reads like a build with no output, nor an
  // Unavailable that would have a follower ask again for a log no node will
  // write. A run past the job's next is InvalidArgument.
  rpc Follow(FollowRequest) returns (stream Job.Event);
}
