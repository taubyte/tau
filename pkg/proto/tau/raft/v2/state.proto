syntax = "proto3";

// state is what one raft group writes for itself: the commands its log carries,
// the entries its state machine holds, and a snapshot of them. None of it is an
// RPC; raft.proto carries Entry for ExportFSM.
package tau.raft.v2;

// Command is one write the log carries.
message Command {
  oneof op {
    Set set = 1;
    Delete delete = 2;
    Batch batch = 3;
    Merge merge = 4;
  }
}

message Set {
  string key = 1;
  bytes value = 2;
}

message Delete {
  string key = 1;
}

// Batch is sets and deletes applied as one store batch.
message Batch {
  repeated Write writes = 1;
}

message Write {
  oneof op {
    Set set = 1;
    Delete delete = 2;
  }
}

// Merge lands a healed split's entries, each kept only where it wins.
message Merge {
  map<string, Entry> delta = 1;
}

// Entry is one key's value: last writer wins on timestamp, then wall clock.
message Entry {
  bytes value = 1;
  uint64 timestamp = 2;
  int64 wall_clock = 3;
  bool deleted = 4;
}

// Snapshot is every entry, tombstones included, and the clock.
message Snapshot {
  map<string, Entry> entries = 1;
  uint64 clock = 2;
}
