syntax = "proto3";

// The cm service's surface between tau nodes, over p2p/rpc: what the
// cloud holds once for every region. Certificates are the first of it.
//
// A cm node keeps the cloud's certificate chains, one record per
// issuance; the private key of each is in the secrets service. Any node that
// needs a certificate orders it itself, keeps it here, and reads the newest
// one back.
package tau.cm.v2;

service CertificateService {
  // Certificate is the newest unexpired certificate kept for a name.
  rpc Certificate(CertificateRequest) returns (Issued);

  // Keep stores one issuance beside the others kept for its name.
  rpc Keep(Issued) returns (Empty);
}

message Empty {}

// SettingsService is the numbers every node of the region computes with alike:
// how many nodes hold each database and each stored object, how many confirm a
// write, and how long a removal is remembered. Each reader caps what it is
// given by the nodes discovery finds.
service SettingsService {
  rpc Current(Empty) returns (Settings);
}

message Settings {
  // replication is how many nodes hold each database.
  uint32 replication = 1;
  // storage_replicas is R and storage_barrier K: how many nodes hold each
  // stored object and index shard, and how many confirm a write.
  uint32 storage_replicas = 2;
  uint32 storage_barrier = 3;
  // retention_seconds is T: how long a removal is remembered. Zero is the
  // database's own default.
  int64 retention_seconds = 4;
}

message CertificateRequest {
  // name is a DNS name, or `*.` and one, lowercase and without a trailing dot.
  string name = 1;
  reserved 2;
}

// Issued is one certificate as kept.
message Issued {
  string name = 1;
  // chain is the leaf first, PEM.
  bytes chain = 2;
  // key names the secret holding the leaf's private key, PEM.
  SecretRef key = 3;
  // not_after is the leaf's expiry, unix seconds.
  int64 not_after = 4;
  // project and zone are set for a name outside the cloud's zone: the
  // project whose proof of zone is checked before it is kept.
  string project = 5;
  string zone = 6;
}

// SecretRef names a secret in the certificate service's cloud scope.
message SecretRef {
  string name = 1;
}

// DomainService proves a custom domain is the project's, the way v1 did: the
// cloud signs a claim over (fqdn, project) and the owner publishes it as a TXT
// record at `<first 8 of the project id>.<fqdn>`.
service DomainService {
  // Claim is the signed claim to publish for one fqdn and project.
  rpc Claim(ClaimRequest) returns (DomainClaim);

  // Prove is Empty when the fqdn is the project's: under a zone already
  // proven for it, or by the TXT record, which is then recorded.
  rpc Prove(ClaimRequest) returns (Empty);
}

message ClaimRequest {
  string fqdn = 1;
  string project = 2;
}

message DomainClaim {
  // entry is the name the TXT record is set at.
  string entry = 1;
  // type is the record type, always "txt".
  string type = 2;
  // token is the record's value.
  string token = 3;
}
