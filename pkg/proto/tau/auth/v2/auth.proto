syntax = "proto3";

// auth's inter-service surface: who may use this cloud.
//
// AUTH IS AUTHORIZATION AND IDENTITY, AND NOTHING ELSE. Which repositories make
// a project, and which project a repository belongs to, is the register's
// project table (tau/register/v2): the project id is the author's, from
// project.yaml, and the register is where a link claims it. A project's
// webhook secret and its repositories' deploy keys are the developer's,
// generated by `tau link` and held by the secrets service. Whether a caller
// may write to a repository is the forge's answer, asked by the build
// frontend with the caller's own token, and the tenancy that bounds which
// namespaces a cloud serves is checked there too. Certificates and domain
// claims are the gateway's and pkg/certificate's. None of those is here.
//
// What is left is who the people using this cloud are: its users, the
// identities they sign in with, the tau tokens it issues them, and whether
// someone a forge vouched for is admitted. The cloud is the authority on its
// users and never on repositories. A forge credential a user connects is
// sealed (encrypted, not merely signed) INSIDE their tau token, so the client
// holds one token and the cloud stores no forge token.
package tau.auth.v2;

// IdentityService answers whether someone a forge vouched for may use this
// cloud's API. The public ingress asks it after the forge has said who holds a
// credential; auth answers from whatever identity its node was composed with,
// and a node composed with none admits every caller the forge vouched for.
message Caller {
  // forge is the host that answered for the credential, e.g. "github.com".
  string forge = 1;
  // subject is the forge's stable id for the account.
  string subject = 2;
  // login is the account's name on the forge, for messages.
  string login = 3;
  // token is the caller's tau token, when they sent one. Auth verifies it
  // and answers for the user it names; a forge identity alone is admitted
  // only when it is linked to a user, or when sign-up is open.
  string token = 4;
}

message Admission {
  bool admitted = 1;
  // reason says why a caller was not admitted, in words it can act on.
  string reason = 2;
  // accounts are what the caller resolved to. Auth carries them and does not
  // read them.
  repeated string accounts = 3;
}

service IdentityService {
  rpc Admit(Caller) returns (Admission);
  // Verify says who a tau token or an API token belongs to, as of now: a
  // revoked token, or one whose user is disabled or gone, is Unauthenticated.
  rpc Verify(VerifyRequest) returns (Principal);
  // Open is the forge credential a tau token carries for one forge host,
  // for the build frontend to ask the forge with. NotFound is a token with
  // no connection to that host. A connection that has expired is refreshed
  // at the forge when it can be, and the answer then carries a renewed tau
  // token holding the new credential, which the frontend hands back to the
  // caller (Tau-Renewed-Token).
  rpc Open(OpenRequest) returns (Opened);
}

message OpenRequest {
  string token = 1;
  // host is the forge host, e.g. "github.com".
  string host = 2;
}

message Opened {
  Principal principal = 1;
  ForgeToken forge = 2;
  // renewed_token is set when the credential was refreshed: the caller's
  // tau token with the refreshed connection in it.
  string renewed_token = 3;
  int64 renewed_expires_unix = 4;
}

message VerifyRequest {
  string token = 1;
}

// Principal is a user as a verified credential presents them.
message Principal {
  User user = 1;
  // token_id is the verified credential's id, so a caller can revoke it.
  string token_id = 2;
}

// Role is a user's standing on this cloud. OSS knows two.
enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_MEMBER = 1;
  ROLE_ADMIN = 2;
}

// Capability is what a local user may do without a provider.
enum Capability {
  CAPABILITY_UNSPECIFIED = 0;
  // CAPABILITY_LOGIN signs in with a password.
  CAPABILITY_LOGIN = 1;
  // CAPABILITY_APIKEY holds API tokens.
  CAPABILITY_APIKEY = 2;
}

message User {
  string id = 1;
  string name = 2;
  // email is lowercased.
  string email = 3;
  Role role = 4;
  bool disabled = 5;
  repeated Capability capabilities = 6;
  // builtin is the admin named in the node's configuration.
  bool builtin = 7;
  repeated Link links = 8;
  int64 created_unix = 9;
}

// Link is an identity a user signs in with: a forge account (issuer is the
// forge host) or an OIDC subject (issuer is the issuer URL).
message Link {
  string issuer = 1;
  string subject = 2;
  string login = 3;
}

// Session is what a sign-in returns: a short-lived access token and the
// refresh token that renews it. Both carry the user's forge connections
// sealed inside them; neither is readable by the client.
message Session {
  string access_token = 1;
  int64 access_expires_unix = 2;
  string refresh_token = 3;
  int64 refresh_expires_unix = 4;
  User user = 5;
  // connections are what the tokens carry, described: never a credential.
  repeated Connection connections = 6;
}

// Connection describes one forge a session is connected to.
message Connection {
  string host = 1;
  string subject = 2;
  string login = 3;
  // expires_unix is when the forge credential expires; zero never.
  int64 expires_unix = 4;
  repeated string scopes = 5;
  // refreshable is whether auth can renew it at the forge.
  bool refreshable = 6;
  // sign_in is whether signing in with this forge account signs in as the
  // session's user. A connection is repository access; the sign-in link is
  // separate, and connecting an account another user is linked to neither
  // moves that link nor switches who the session is.
  SignInLink sign_in = 7;
}

// SignInLink is who a forge account signs in as, on this cloud.
//
// "LINKED FIRST" IS A DETERMINISTIC WINNER, not wall-clock arrival: two users
// claiming one forge account concurrently on two nodes each write their own
// claim, and every node resolves them the same way — earliest claim
// timestamp, then lowest user id (services/auth/store.go winner).
enum SignInLink {
  // SIGN_IN_LINK_NONE: no user is linked to the account.
  SIGN_IN_LINK_NONE = 0;
  // SIGN_IN_LINK_THIS_USER: signing in with the account is this user.
  SIGN_IN_LINK_THIS_USER = 1;
  // SIGN_IN_LINK_OTHER_USER: connected for repository access only; signing in
  // with the account is another user, who holds the link.
  SIGN_IN_LINK_OTHER_USER = 2;
}

// ForgeToken is a forge's own credential. It leaves auth only to the build
// frontend, through Open, and is never stored.
message ForgeToken {
  // host is the forge the token is for, and the only host it may be sent to.
  string host = 1;
  string access_token = 2;
  string refresh_token = 3;
  string token_type = 4;
  int64 expires_unix = 5;
  repeated string scopes = 6;
  string subject = 7;
  string login = 8;
  // renewals counts how often auth renewed the credential at the forge, and
  // obtained_unix_nano is when this one was obtained. Together they order two
  // credentials of one connection: two seals of a session are merged per
  // host, the more renewed credential winning, the later obtained on a tie.
  int64 renewals = 9;
  int64 obtained_unix_nano = 10;
}

// Sealed is the plaintext a tau token's connections are sealed from. It never
// leaves auth unsealed.
message Sealed {
  // user and session bind the seal to one session of one user, so it cannot
  // be moved into another token.
  string user = 1;
  string session = 2;
  // sealed_unix_nano is when the seal was made.
  int64 sealed_unix_nano = 3;
  repeated ForgeToken connections = 4;
  // generation counts the renewals and merges this seal descends from in its
  // session. An access token carries it in the clear (claim tau_gen), so a
  // client keeps the newest of two tokens by (generation, issued-at) rather
  // than by which response arrived last.
  int64 generation = 5;
}

message SignedIn {
  Session session = 1;
}

// Provider is one way to sign in on this cloud.
message Provider {
  // id is what a client names it by: a forge host ("github.com"), or the
  // OIDC provider's configured name.
  string id = 1;
  ProviderKind kind = 2;
  // browser is a redirect sign-in (Authorize, then Exchange).
  bool browser = 3;
  // device is the device flow (DeviceStart, then DevicePoll).
  bool device = 4;
  // pasted is a sign-in with a token the user pastes.
  bool pasted = 5;
  string name = 6;
}

enum ProviderKind {
  PROVIDER_KIND_UNSPECIFIED = 0;
  PROVIDER_KIND_FORGE = 1;
  PROVIDER_KIND_OIDC = 2;
}

message ProvidersRequest {}

message ProvidersResponse {
  repeated Provider providers = 1;
  // password is whether a password sign-in is offered at all.
  bool password = 2;
}

message LoginRequest {
  string name = 1;
  string password = 2;
}

message RefreshRequest {
  string refresh_token = 1;
  // access_tokens are the access tokens of this session the client was
  // handed since it last refreshed, expired or not. Each may carry a forge
  // credential renewed during a request; the session's connections are
  // merged from them and the refresh token's seal PER HOST, the newest
  // credential of each host winning (ForgeToken.renewals, then
  // obtained_unix_nano), so two requests renewing two hosts lose neither.
  repeated string access_tokens = 2;
}

message LogoutRequest {
  string refresh_token = 1;
}

message LogoutResponse {}

message AuthorizeRequest {
  string provider = 1;
  // redirect_uri is where the provider sends the browser back: a loopback
  // address on any port at /callback, or one of the cloud's configured
  // console callbacks, exactly.
  string redirect_uri = 2;
  // binding_challenge is base64url(sha256(binding_verifier)), chosen by the
  // client. Exchange refuses a code whose redeemer cannot show the verifier,
  // so an intercepted callback cannot be redeemed by someone else.
  string binding_challenge = 3;
  // invite is a code that lets a first sign-in create its user.
  string invite = 4;
}

message AuthorizeResponse {
  // url is where to send the browser.
  string url = 1;
  string state = 2;
  int64 expires_unix = 3;
}

message ExchangeRequest {
  string state = 1;
  string code = 2;
  string binding_verifier = 3;
  reserved 4;
}

message DeviceStartRequest {
  string provider = 1;
}

message DeviceStartResponse {
  string device_code = 1;
  string user_code = 2;
  string verification_uri = 3;
  string verification_uri_complete = 4;
  int64 interval_seconds = 5;
  int64 expires_unix = 6;
}

message DevicePollRequest {
  string provider = 1;
  string device_code = 2;
  string invite = 3;
  reserved 4;
}

message DevicePollResponse {
  // pending is true while the user has not approved yet; poll again after
  // interval_seconds.
  bool pending = 1;
  int64 interval_seconds = 2;
  SignedIn signed_in = 3;
}

message PastedRequest {
  string provider = 1;
  string token = 2;
  string invite = 3;
  reserved 4;
}

message WhoamiRequest {}

// DisconnectRequest drops the connection to host from the caller's tau token
// (Authorization: Bearer). The session that token belongs to is revoked in
// favour of the new one.
message DisconnectRequest {
  string host = 1;
  reserved 2;
}

message ConnectionsRequest {}

message ConnectionsResponse {
  repeated Connection connections = 1;
}

// SessionService is the public sign-in surface, reached through the build
// frontend. A call that acts as a user carries its tau token as
// `Authorization: Bearer`.
//
// CONNECTING A FORGE is a forge sign-in (Exchange, DevicePoll, Pasted) made
// while carrying a tau token: the answer is a new session for the same user
// with that forge's connection added (one per host, replacing an older one)
// and every other connection kept. The session the caller's tau token
// belongs to is revoked in its favour — its access and refresh tokens both.
//
// NO CALL HANDS A CLIENT A FORGE CREDENTIAL. Whatever a client needs done at
// a forge (`tau link` installing a webhook and a deploy key) is a narrow
// route on the build frontend, which opens the connection itself and
// authorizes the caller on the repository first.
//
// REVOCATION IS EVENTUAL. A node that has not yet received a revocation
// marker honours the session until it does; the session's own expiry
// (RefreshTTL, 24h by default) is the bound, not the access token's TTL.
service SessionService {
  rpc Providers(ProvidersRequest) returns (ProvidersResponse);
  rpc Login(LoginRequest) returns (SignedIn);
  rpc Refresh(RefreshRequest) returns (SignedIn);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc Authorize(AuthorizeRequest) returns (AuthorizeResponse);
  rpc Exchange(ExchangeRequest) returns (SignedIn);
  rpc DeviceStart(DeviceStartRequest) returns (DeviceStartResponse);
  rpc DevicePoll(DevicePollRequest) returns (DevicePollResponse);
  rpc Pasted(PastedRequest) returns (SignedIn);
  rpc Whoami(WhoamiRequest) returns (User);
  rpc Disconnect(DisconnectRequest) returns (SignedIn);
  rpc Connections(ConnectionsRequest) returns (ConnectionsResponse);
}

message ListUsersRequest {}

message ListUsersResponse {
  repeated User users = 1;
}

message CreateUserRequest {
  string name = 1;
  string email = 2;
  Role role = 3;
  repeated Capability capabilities = 4;
  // password is required with CAPABILITY_LOGIN.
  string password = 5;
}

message UserRequest {
  string id = 1;
}

message SetRoleRequest {
  string id = 1;
  Role role = 2;
}

message SetDisabledRequest {
  string id = 1;
  bool disabled = 2;
}

message SetPasswordRequest {
  // id is empty for the caller's own password.
  string id = 1;
  string password = 2;
}

message Empty {}

message CreateInviteRequest {
  Role role = 1;
  // ttl_seconds bounds the invite; zero is the default (seven days).
  int64 ttl_seconds = 2;
  string note = 3;
}

message Invite {
  string id = 1;
  Role role = 2;
  int64 expires_unix = 3;
  string note = 4;
  // code is returned once, when the invite is created.
  string code = 5;
  string created_by = 6;
}

message ListInvitesResponse {
  repeated Invite invites = 1;
}

message CreateTokenRequest {
  string name = 1;
  // ttl_seconds of zero never expires.
  int64 ttl_seconds = 2;
  // user is empty for the caller; an admin may name a user with
  // CAPABILITY_APIKEY.
  string user = 3;
}

message Token {
  string id = 1;
  string name = 2;
  string user = 3;
  int64 created_unix = 4;
  int64 expires_unix = 5;
  // secret is returned once, when the token is created.
  string secret = 6;
}

message ListTokensRequest {
  string user = 1;
}

message ListTokensResponse {
  repeated Token tokens = 1;
}

message RevokeTokenRequest {
  string id = 1;
}

// UserService manages this cloud's users. Every call carries a tau token;
// all but the caller's own tokens and password are an admin's.
service UserService {
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc CreateUser(CreateUserRequest) returns (User);
  rpc DeleteUser(UserRequest) returns (Empty);
  rpc SetRole(SetRoleRequest) returns (User);
  rpc SetDisabled(SetDisabledRequest) returns (User);
  rpc SetPassword(SetPasswordRequest) returns (Empty);
  rpc CreateInvite(CreateInviteRequest) returns (Invite);
  rpc ListInvites(Empty) returns (ListInvitesResponse);
  rpc DeleteInvite(UserRequest) returns (Empty);
  rpc CreateToken(CreateTokenRequest) returns (Token);
  rpc ListTokens(ListTokensRequest) returns (ListTokensResponse);
  rpc RevokeToken(RevokeTokenRequest) returns (Empty);
}
