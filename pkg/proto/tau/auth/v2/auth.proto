syntax = "proto3";

// auth's inter-service surface: who may use this cloud.
//
// AUTH IS AUTHORIZATION AND IDENTITY, AND NOTHING ELSE. Who the people using
// this cloud are: its users, the identities they sign in with, the tau tokens it
// issues them, and whether someone a forge vouched for is admitted. And who a
// project is: which configuration repository claimed its id (the author's, from
// project.yaml), which code repositories it attaches, who linked it, and the
// roles its owner granted (ProjectService).
//
// What a project compiled to is the register's (tau/register/v2). A project's
// webhook secret and its repositories' deploy keys are the developer's,
// generated by `tau link` and held by the secrets service. Whether a caller may
// write to a repository is the forge's answer, asked by the build frontend with
// the caller's own token, and the tenancy that bounds which namespaces a cloud
// serves is checked there too. Certificates and domain claims are cm's. None of
// those is here.
//
// The cloud is the authority on its users and its project table, never on
// repositories. It stores and carries no forge credential: the one a forge
// sign-in obtains goes back to the client, which holds it.
package tau.auth.v2;

// IdentityService answers whether someone a forge vouched for may use this
// cloud's API. The public ingress asks it after the forge has said who holds a
// credential; auth answers from whatever identity its node was composed with,
// and a node composed with none admits every caller the forge vouched for.
message Caller {
  // forge is the host that answered for the credential, e.g. "github.com".
  string forge = 1;
  // subject is the forge's stable id for the account.
  string subject = 2;
  // login is the account's name on the forge, for messages.
  string login = 3;
  // token is the caller's tau token, when they sent one. Auth verifies it
  // and answers for the user it names; a forge identity alone is admitted
  // only when it is linked to a user, or when sign-up is open.
  string token = 4;
}

message Admission {
  bool admitted = 1;
  // reason says why a caller was not admitted, in words it can act on.
  string reason = 2;
  // accounts are what the caller resolved to. Auth carries them and does not
  // read them.
  repeated string accounts = 3;
}

service IdentityService {
  rpc Admit(Caller) returns (Admission);
  // Verify says who a tau token or an API token belongs to, as of now: a
  // revoked token, or one whose user is disabled or gone, is Unauthenticated.
  rpc Verify(VerifyRequest) returns (Principal);
}

message VerifyRequest {
  string token = 1;
}

// Principal is a user as a verified credential presents them.
message Principal {
  User user = 1;
  // token_id is the verified credential's id, so a caller can revoke it.
  string token_id = 2;
}

// Role is a user's standing on this cloud. There are two.
enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_MEMBER = 1;
  ROLE_ADMIN = 2;
}

// Capability is what a local user may do without a provider.
enum Capability {
  CAPABILITY_UNSPECIFIED = 0;
  // CAPABILITY_LOGIN signs in with a password.
  CAPABILITY_LOGIN = 1;
  // CAPABILITY_APIKEY holds API tokens.
  CAPABILITY_APIKEY = 2;
}

message User {
  string id = 1;
  string name = 2;
  // email is lowercased.
  string email = 3;
  Role role = 4;
  bool disabled = 5;
  repeated Capability capabilities = 6;
  // builtin is the admin named in the node's configuration.
  bool builtin = 7;
  repeated Link links = 8;
  int64 created_unix = 9;
}

// Link is an identity a user signs in with: a forge account (issuer is the
// forge host) or an OIDC subject (issuer is the issuer URL).
message Link {
  string issuer = 1;
  string subject = 2;
  string login = 3;
}

// Session is what a sign-in returns: a short-lived access token and the
// refresh token that renews it.
message Session {
  string access_token = 1;
  int64 access_expires_unix = 2;
  string refresh_token = 3;
  int64 refresh_expires_unix = 4;
  User user = 5;
  reserved 6;
}

// Connection describes the forge account a forge sign-in was made with.
message Connection {
  string host = 1;
  string subject = 2;
  string login = 3;
  // expires_unix is when the forge credential expires; zero never.
  int64 expires_unix = 4;
  repeated string scopes = 5;
  // refreshable is whether the credential carries a refresh token.
  bool refreshable = 6;
  // sign_in is whether signing in with this forge account signs in as the
  // caller. Connecting an account another user is linked to neither moves
  // that link nor switches who the caller is.
  SignInLink sign_in = 7;
}

// SignInLink is who a forge account signs in as, on this cloud.
//
// "LINKED FIRST" IS A DETERMINISTIC WINNER, not wall-clock arrival: two users
// claiming one forge account concurrently on two nodes each write their own
// claim, and every node resolves them the same way — earliest claim
// timestamp, then lowest user id (services/auth/store.go winner).
enum SignInLink {
  // SIGN_IN_LINK_NONE: no user is linked to the account.
  SIGN_IN_LINK_NONE = 0;
  // SIGN_IN_LINK_THIS_USER: signing in with the account is this user.
  SIGN_IN_LINK_THIS_USER = 1;
  // SIGN_IN_LINK_OTHER_USER: signing in with the account is another user,
  // who holds the link.
  SIGN_IN_LINK_OTHER_USER = 2;
}

// ForgeToken is a forge's own credential, the client's to hold. Auth never
// stores it.
message ForgeToken {
  // host is the forge the token is for, and the only host it may be sent to.
  string host = 1;
  string access_token = 2;
  string refresh_token = 3;
  string token_type = 4;
  int64 expires_unix = 5;
  repeated string scopes = 6;
  string subject = 7;
  string login = 8;
  reserved 9, 10;
}

// SignedIn is what a sign-in returns. session is unset for a forge sign-in
// made while carrying a tau token; forge and connection are set for every
// forge sign-in and unset otherwise.
message SignedIn {
  Session session = 1;
  // forge is the credential this sign-in obtained.
  ForgeToken forge = 2;
  Connection connection = 3;
}

// Provider is one way to sign in on this cloud.
message Provider {
  // id is what a client names it by: a forge host ("github.com"), or the
  // OIDC provider's configured name.
  string id = 1;
  ProviderKind kind = 2;
  // browser is a redirect sign-in (Authorize, then Exchange).
  bool browser = 3;
  // device is the device flow (DeviceStart, then DevicePoll).
  bool device = 4;
  // pasted is a sign-in with a token the user pastes.
  bool pasted = 5;
  string name = 6;
}

enum ProviderKind {
  PROVIDER_KIND_UNSPECIFIED = 0;
  PROVIDER_KIND_FORGE = 1;
  PROVIDER_KIND_OIDC = 2;
}

message ProvidersRequest {}

message ProvidersResponse {
  repeated Provider providers = 1;
  // password is whether a password sign-in is offered at all.
  bool password = 2;
}

message LoginRequest {
  string name = 1;
  string password = 2;
}

message RefreshRequest {
  string refresh_token = 1;
  reserved 2;
}

message LogoutRequest {
  string refresh_token = 1;
}

message LogoutResponse {}

message AuthorizeRequest {
  string provider = 1;
  // redirect_uri is where the provider sends the browser back: a loopback
  // address on any port at /callback, or one of the cloud's configured
  // console callbacks, exactly.
  string redirect_uri = 2;
  // binding_challenge is base64url(sha256(binding_verifier)), chosen by the
  // client. Exchange refuses a code whose redeemer cannot show the verifier,
  // so an intercepted callback cannot be redeemed by someone else.
  string binding_challenge = 3;
  // invite is a code that lets a first sign-in create its user.
  string invite = 4;
}

message AuthorizeResponse {
  // url is where to send the browser.
  string url = 1;
  string state = 2;
  int64 expires_unix = 3;
}

message ExchangeRequest {
  string state = 1;
  string code = 2;
  string binding_verifier = 3;
  reserved 4;
}

message DeviceStartRequest {
  string provider = 1;
}

message DeviceStartResponse {
  string device_code = 1;
  string user_code = 2;
  string verification_uri = 3;
  string verification_uri_complete = 4;
  int64 interval_seconds = 5;
  int64 expires_unix = 6;
}

message DevicePollRequest {
  string provider = 1;
  string device_code = 2;
  string invite = 3;
  reserved 4;
}

message DevicePollResponse {
  // pending is true while the user has not approved yet; poll again after
  // interval_seconds.
  bool pending = 1;
  int64 interval_seconds = 2;
  SignedIn signed_in = 3;
}

message PastedRequest {
  string provider = 1;
  string token = 2;
  string invite = 3;
  reserved 4;
}

message WhoamiRequest {}

// RenewRequest is a forge refresh token the client holds, renewed through
// this cloud's OAuth app at host.
message RenewRequest {
  string host = 1;
  string refresh_token = 2;
}

// SessionService is the public sign-in surface, reached through the build
// frontend. A call that acts as a user carries its tau token as
// `Authorization: Bearer`.
//
// CONNECTING A FORGE is a forge sign-in (Exchange, DevicePoll, Pasted) made
// while carrying a tau token: the answer has no session, only the forge
// credential and its connection, and links the forge account to the caller
// when no user holds it. The caller's session is untouched.
//
// THE FORGE CREDENTIAL IS THE CLIENT'S. Every forge sign-in returns it, and
// the client acts at the forge itself; Renew refreshes it through this
// cloud's OAuth app, which only the cloud holds the secret of.
//
// REVOCATION IS EVENTUAL. A node that has not yet received a revocation
// marker honours the session until it does; the session's own expiry
// (RefreshTTL, 24h by default) is the bound, not the access token's TTL.
service SessionService {
  rpc Providers(ProvidersRequest) returns (ProvidersResponse);
  rpc Login(LoginRequest) returns (SignedIn);
  rpc Refresh(RefreshRequest) returns (SignedIn);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc Authorize(AuthorizeRequest) returns (AuthorizeResponse);
  rpc Exchange(ExchangeRequest) returns (SignedIn);
  rpc DeviceStart(DeviceStartRequest) returns (DeviceStartResponse);
  rpc DevicePoll(DevicePollRequest) returns (DevicePollResponse);
  rpc Pasted(PastedRequest) returns (SignedIn);
  rpc Whoami(WhoamiRequest) returns (User);
  rpc Renew(RenewRequest) returns (ForgeToken);
}

message ListUsersRequest {}

message ListUsersResponse {
  repeated User users = 1;
}

message CreateUserRequest {
  string name = 1;
  string email = 2;
  Role role = 3;
  repeated Capability capabilities = 4;
  // password is required with CAPABILITY_LOGIN.
  string password = 5;
}

message UserRequest {
  string id = 1;
}

message SetRoleRequest {
  string id = 1;
  Role role = 2;
}

message SetDisabledRequest {
  string id = 1;
  bool disabled = 2;
}

message SetPasswordRequest {
  // id is empty for the caller's own password.
  string id = 1;
  string password = 2;
}

message Empty {}

message CreateInviteRequest {
  Role role = 1;
  // ttl_seconds bounds the invite; zero is the default (seven days).
  int64 ttl_seconds = 2;
  string note = 3;
}

message Invite {
  string id = 1;
  Role role = 2;
  int64 expires_unix = 3;
  string note = 4;
  // code is returned once, when the invite is created.
  string code = 5;
  string created_by = 6;
}

message ListInvitesResponse {
  repeated Invite invites = 1;
}

message CreateTokenRequest {
  string name = 1;
  // ttl_seconds of zero never expires.
  int64 ttl_seconds = 2;
  // user is empty for the caller; an admin may name a user with
  // CAPABILITY_APIKEY.
  string user = 3;
}

message Token {
  string id = 1;
  string name = 2;
  string user = 3;
  int64 created_unix = 4;
  int64 expires_unix = 5;
  // secret is returned once, when the token is created.
  string secret = 6;
}

message ListTokensRequest {
  string user = 1;
}

message ListTokensResponse {
  repeated Token tokens = 1;
}

message RevokeTokenRequest {
  string id = 1;
}

// UserService manages this cloud's users. Every call carries a tau token;
// all but the caller's own tokens and password are an admin's.
service UserService {
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc CreateUser(CreateUserRequest) returns (User);
  rpc DeleteUser(UserRequest) returns (Empty);
  rpc SetRole(SetRoleRequest) returns (User);
  rpc SetDisabled(SetDisabledRequest) returns (User);
  rpc SetPassword(SetPasswordRequest) returns (Empty);
  rpc CreateInvite(CreateInviteRequest) returns (Invite);
  rpc ListInvites(Empty) returns (ListInvitesResponse);
  rpc DeleteInvite(UserRequest) returns (Empty);
  rpc CreateToken(CreateTokenRequest) returns (Token);
  rpc ListTokens(ListTokensRequest) returns (ListTokensResponse);
  rpc RevokeToken(RevokeTokenRequest) returns (Empty);
}

// The project table. Its rows live under their own prefix in auth's store
// (services/auth/projects); a deploy only READS them, to check the id it is
// about to publish is claimed by the repository it was pushed to.
//
// ListProjects is the one enumeration: every linked project, for an operator's
// view of a cloud (taucorder). It is a scan of the table, which grows with
// links rather than with traffic, and like everything here it is reachable by
// any swarm peer, the swarm trust model. ProjectsOf lists one claimant's own
// index.
//
// AUTHORIZATION OF A LINK IS NOT HERE: whether the claimant may write to the
// repositories it names is the build frontend's to establish before it calls
// Link.

message ProjectRequest {
  string project = 1;
}

// LinkRequest claims a project id for a configuration repository.
message LinkRequest {
  string project = 1;
  string config_repository = 2;
  repeated string code_repositories = 3;
  // claimant is the tau user id of the caller the build frontend
  // authenticated. It is never a node.
  string claimant = 4;
  // replace makes this link the project's whole set of repositories; the
  // build frontend sets it only for the project's owner.
  bool replace = 5;
}

// ProjectRecord is a linked project as every node resolves it.
message ProjectRecord {
  string id = 1;
  string config_repository = 2;
  repeated string code_repositories = 3;
  string claimant = 4;
  // created_at is when the owning claim was made, unix nanoseconds.
  int64 created_at = 5;
}

message RepositoryRequest {
  string repository = 1;
}

// RepositoryRecord is which project owns a repository.
message RepositoryRecord {
  string project = 1;
  string repository = 2;
  // configures is whether it is that project's configuration repository.
  bool configures = 3;
}

message ClaimantRequest {
  string claimant = 1;
}

message ProjectRecords {
  repeated ProjectRecord projects = 1;
}

message ListProjectsRequest {}

// GrantRequest gives grantee, a tau user id, one role on a linked project.
// role is viewer, builder, secret-manager or owner.
message GrantRequest {
  string project = 1;
  string grantee = 2;
  string role = 3;
  // by is the tau user id of the owner the build frontend authorized.
  string by = 4;
}

// GrantRecord is one grant. at is unix nanoseconds.
message GrantRecord {
  string id = 1;
  string project = 2;
  string grantee = 3;
  string role = 4;
  string by = 5;
  int64 at = 6;
}

message GrantRecords {
  repeated GrantRecord grants = 1;
}

// RevokeRequest withdraws one grant for good.
message RevokeRequest {
  string project = 1;
  string grant_id = 2;
  string by = 3;
}

message RevokeResponse {}

message RoleRequest {
  string project = 1;
  string user = 2;
}

// RoleAnswer is a user's role on a project; empty is none.
message RoleAnswer {
  string role = 1;
}

service ProjectService {
  // Link claims a project id for a configuration repository and attaches
  // code repositories. An id or repository another project owns is
  // AlreadyExists, naming the owner.
  rpc Link(LinkRequest) returns (ProjectRecord);

  // Project is one linked project. An id nobody claimed is NotFound.
  rpc Project(ProjectRequest) returns (ProjectRecord);

  // Repository is which project owns a repository. One no project owns is
  // NotFound.
  rpc Repository(RepositoryRequest) returns (RepositoryRecord);

  // ProjectsOf is every project one user linked and its repository still
  // owns, or holds a live grant on.
  rpc ProjectsOf(ClaimantRequest) returns (ProjectRecords);

  // ListProjects is every linked project, sorted by id.
  rpc ListProjects(ListProjectsRequest) returns (ProjectRecords);

  // Grant gives a tau user a role on a linked project. An unknown project is
  // NotFound; an unknown role is InvalidArgument.
  rpc Grant(GrantRequest) returns (GrantRecord);

  // Revoke withdraws a grant; a revocation always wins over its grant. An id
  // the project never granted is NotFound.
  rpc Revoke(RevokeRequest) returns (RevokeResponse);

  // Grants is every live grant on a project, oldest first.
  rpc Grants(ProjectRequest) returns (GrantRecords);

  // Role is one user's role on a project: owner for the owning claim's
  // claimant, else the highest live grant. An unknown project is NotFound.
  rpc Role(RoleRequest) returns (RoleAnswer);
}
