syntax = "proto3";

// stats is the half of v1's seer that can be lied to.
//
// v1's seer did DNS and also accumulated where things are and how loaded they
// are. In v2 those are two services, because they have different shapes at
// scale and different trust properties: `dns` answers queries, `stats`
// collects usage, and BOTH dns and gateway read stats in order to route.
//
// THERE IS NO SERVICE BLOCK IN THIS FILE, AND THAT IS THE DESIGN.
//
// Every other v2 proto so far declares RPCs because it models a request one
// service makes of another. Stats models the opposite: a fact a node
// volunteers about itself, to everyone, repeatedly. That is a broadcast, and
// it goes out over libp2p pubsub rather than over a ConnectRPC method, for
// three reasons that are all the same reason —
//
//   * the fan-out is every node, so N RPC calls per report per node is N^2
//     dials to move data that nobody has to acknowledge;
//   * a lost report is not an error. The next one is along shortly, and the
//     reader already knows how old what it holds is (pkg/v2/stats puts Age on
//     every row). An RPC's delivery guarantee would be paid for and discarded;
//   * a read is LOCAL. Routing latency is on every request, and the whole
//     point of collecting reports continuously is that answering "who serves
//     this name" never becomes a network round trip, let alone a quorum.
//
// So what crosses the wire is one message, and the thing that consumes it is
// pkg/v2/stats — a state machine with no host, no pubsub and no goroutine in
// it, so what this message means is a unit test.
//
// A REPORT IS A CLAIM. pkg/v2/membership deliberately carries no capacity, no
// load and no weight, because its output is placement and placement must not
// be steerable by a node describing itself. Routing is the inverse — it is a
// decision made FROM the claims — so every field below is self-reported and
// every field below steers traffic. In a single-tenant fleet that is honest.
// Verified reporting is an interface away, and it is not this message's job to
// pretend otherwise.
package tau.stats.v1;

// Report is what one node says about itself, broadcast periodically.
//
// IT CARRIES NO TIMESTAMP, and the absence is load-bearing. A peer that could
// stamp its own report could extend its own validity forever, which is the
// rule membership already holds (its Beat carries no clock either). Freshness
// is measured by the receiver, from the local instant the report arrived.
//
// It matters more here than for liveness: a stale load figure is not a missing
// one, it is a confidently wrong one. A node that reports 5% and then wedges
// keeps attracting traffic for as long as anything trusts what it last said.
message Report {
  // peer is the reporter's identity, and this report is authoritative for it
  // and for no other. One writer per row is what keeps a gossiped view free of
  // any key two nodes can write differently.
  string peer = 1;

  // incarnation distinguishes one run of a peer from the next: chosen at boot,
  // never lowered, never compared across peers and never converted to a time.
  // It is what makes a report that was in flight when a node went down
  // refusable by the run that replaced it.
  uint64 incarnation = 2;

  // load is the reporter's own view of how busy it is, between 0 and 1.
  //
  // WHAT IT MEASURES IS THE REPORTER'S BUSINESS. CPU, memory, queue depth or
  // a considered guess are all legitimate, because the right answer differs
  // per workload and the node is the only party that knows its own. A reader
  // compares these numbers; it must not grow an opinion about where they came
  // from, or every workload that measures itself differently becomes wrong.
  double load = 3;

  // serving is what this node can currently answer for. Routing intersects it
  // with the name being resolved, so a node that stops serving something drops
  // out of the answer by reporting a shorter list — nothing has to notice a
  // removal, and there is no separate withdrawal message to lose.
  repeated string serving = 4;

  // ready is false when the node is up and reporting but does not want
  // requests: draining, warming, or degraded.
  //
  // IT IS SEPARATE FROM load BECAUSE "BUSY" AND "SEND ME NOTHING" ARE
  // DIFFERENT SENTENCES. A node at 0.99 load is still the correct answer when
  // it is the only one serving a name — refusing to answer is worse than
  // answering with the busy node, and the reader can see the number and
  // decide. A draining node is never the answer, whatever its load says.
  bool ready = 5;

  // addresses is where clients reach this node — the IPs a DNS answer is made
  // of, not the libp2p multiaddrs the fleet gossips over.
  //
  // THE TWO ARE DIFFERENT AND CONFLATING THEM IS A REAL BUG, not a tidiness
  // point. A node's peerstore address is how other NODES dial it, and behind
  // NAT, a mesh VPN or a container bridge that is routinely an address no
  // client can reach. Answering DNS from the peerstore would hand the internet
  // an address that works from inside the fleet and nowhere else, and it would
  // do it only for the deployments that have such a topology — which is the
  // ones that are hardest to debug.
  //
  // So it is reported, not derived: the node states where it believes clients
  // can reach it, the same way it states its load, and it is a claim in the
  // same sense. A node that reports an address it does not answer on takes
  // traffic it cannot serve, and only the caller's health checking catches
  // that.
  repeated string addresses = 6;
}
