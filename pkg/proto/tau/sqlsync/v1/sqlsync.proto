// SQLSync is how the copies of one replicated `sql` database reach each other.
//
// The database engine (pkg/database/engines/sql/distributed) keeps each
// database in musql, whose replication layer converges copies by anti-entropy:
// exchange version vectors, pull the ops a peer is missing, exchange
// acknowledgements so the op log can be pruned, and bootstrap from a snapshot
// when what is missing has been pruned. These four calls are that, and nothing
// else; a write's low-latency delivery is a pubsub message (Push), not an RPC.
//
// ONE SERVICE PER NODE, FOR EVERY DATABASE IT HOLDS. Every request names its
// database, so one handler answers for all of them; a protocol per database
// would be a stream handler per database on one host.
syntax = "proto3";

package tau.sqlsync.v1;

// Cell is one changed column of a row, in musql's encoding.
message Cell {
  string col = 1;
  uint32 type = 2;
  bytes val = 3;
}

// Op is one row change, stamped by the site that made it.
message Op {
  string site = 1;
  uint64 seq = 2;
  uint64 hlc = 3;
  string tbl = 4;
  bytes pk = 5;
  uint32 kind = 6;
  repeated Cell cells = 7;
}

// VVEntry is one site's highest sequence number.
message VVEntry {
  string site = 1;
  uint64 seq = 2;
}

message AckEntry {
  string site = 1;
  uint64 hlc = 2;
  repeated VVEntry vv = 3;
}

message ClockCell {
  string tbl = 1;
  bytes pk = 2;
  string col = 3;
  uint64 hlc = 4;
  string site = 5;
  bytes val = 6;
}

message RangeEntry {
  string site = 1;
  uint64 lo = 2;
}

message ExchangeVVRequest {
  string database = 1;
  repeated VVEntry vv = 2;
}

message ExchangeVVResponse {
  repeated VVEntry vv = 1;
}

message GetOpsRequest {
  string database = 1;
  string site = 2;
  uint64 from_seq = 3;
  uint32 limit = 4;
}

// GetOpsResponse says `pruned` when what was asked for is below the answerer's
// floor, which is the asker's cue to bootstrap from a snapshot.
message GetOpsResponse {
  repeated Op ops = 1;
  bool pruned = 2;
}

message ExchangeAcksRequest {
  string database = 1;
  repeated AckEntry acks = 2;
}

message ExchangeAcksResponse {
  repeated AckEntry acks = 1;
}

message GetSnapshotRequest {
  string database = 1;
  uint32 part = 2;
  bytes cursor = 3;
}

message GetSnapshotResponse {
  repeated Op ops = 1;
  repeated VVEntry floors = 2;
  repeated RangeEntry ranges = 3;
  repeated ClockCell cells = 4;
  bytes next = 5;
}

// Push is what a write's pubsub message carries: the database's own topic
// already names the database, so the op is all it holds.
message Push {
  Op op = 1;
}

service SQLSyncService {
  rpc ExchangeVV(ExchangeVVRequest) returns (ExchangeVVResponse);
  rpc GetOps(GetOpsRequest) returns (GetOpsResponse);
  rpc ExchangeAcks(ExchangeAcksRequest) returns (ExchangeAcksResponse);
  rpc GetSnapshot(GetSnapshotRequest) returns (GetSnapshotResponse);
}
