syntax = "proto3";

// store is what the secrets service writes for itself. None of it is an RPC.
package tau.secrets.v2;

import "tau/secrets/v2/secrets.proto";

// StoredKey is a group key as the shared store keeps it: its public half and
// the round's summed Feldman commitment, one element per coefficient.
message StoredKey {
  GroupKey key = 1;
  repeated bytes verification = 2;
}

// StoredSecret is one version of a secret at rest. written_at is unix
// nanoseconds.
message StoredSecret {
  bytes ciphertext = 1;
  int64 written_at = 2;
}

// StoredShare is this node's share of one key. stored_at is unix nanoseconds
// on this node's own clock.
message StoredShare {
  bytes id = 1;
  bytes value = 2;
  int64 stored_at = 3;
}
