syntax = "proto3";

// storage is where a project's bytes live: the objects of its `storage` resources
// and the platform's own assets of it, its builds' artifacts and logs. A bucket
// instance's index is replicated across the holders of its shard; an object's
// bytes are held by the nodes placement names for its root, and a write is
// acknowledged once enough of them hold it that one node going away loses nothing.
//
// No authorization: any peer that can reach this service can read and write any
// project's bytes. Swarm membership, enforced by the cloud's CA, is the boundary,
// as for the register, secrets and database.
package tau.storage.v2;

// VersionRecord is the value of a version row: everything head needs, so
// resolution never fetches a block.
message VersionRecord {
  string root_cid = 1;
  uint64 size = 2;
  string content_type = 3;
  uint64 created_ms = 4;
  string writer = 5;
  bool tombstone = 6;
  bool exclusive = 7;
  // metadata is the caller's own name/value pairs, as an S3 object carries them,
  // sorted by name: every holder of a shard writes this row under one key, so its
  // bytes must not depend on map order.
  repeated Metadata metadata = 8;
  // kept is a version its bucket keeps once a later one supersedes it: one its
  // holders never collect.
  bool kept = 9;
}

message Metadata {
  string name = 1;
  string value = 2;
}

// Address is one bucket instance: a `storage` resource's id, or the reserved
// bucket a project's assets are kept in, in one environment of one project.
message Address {
  string project = 1;
  string environment = 2;
  string bucket = 3;
  string instance = 4;
}

// PutHead says what the bytes after it are. It is the first message of a Put.
message PutHead {
  Address at = 1;
  // name is the object's name within the instance, any bytes.
  bytes name = 2;
  string content_type = 3;
  map<string, string> metadata = 4;
  // versioned is a bucket that keeps every version, so this one is kept once a
  // later one supersedes it.
  bool versioned = 5;
}

message PutRequest {
  oneof part {
    PutHead head = 1;
    bytes chunk = 2;
  }
}

// Version is one version of one object, as a reader sees it.
message Version {
  string root_cid = 1;
  uint64 stamp = 2;
  string writer = 3;
  uint64 size = 4;
  string content_type = 5;
  bool tombstone = 6;
  uint64 created_ms = 7;
  map<string, string> metadata = 8;
  // name is the object's, set where a response carries versions of many.
  bytes name = 9;
}

message PutResponse {
  Version version = 1;
  // holders is how many nodes held the bytes when the version was written: at
  // least the cloud's barrier.
  uint32 holders = 2;
}

// HoldRequest asks a node placement names for a root to fetch it from the node
// that has it and keep it, for the version it is about to become.
message HoldRequest {
  string root_cid = 1;
  // from is the peer that has every block now.
  string from = 2;
  Address at = 3;
  bytes name = 4;
  uint64 stamp = 5;
}

message HoldResponse {}

// AppendRequest writes one version row on a holder of the instance's shard, for a
// node that does not hold it.
message AppendRequest {
  Address at = 1;
  bytes name = 2;
  uint64 stamp = 3;
  VersionRecord record = 4;
}

message AppendResponse {}

message CurrentRequest {
  Address at = 1;
  bytes name = 2;
  // here answers from this node's copy of the index, never forwarding: what one
  // storage node asks another that placement names as a holder.
  bool here = 3;
}

message CurrentResponse {
  Version version = 1;
}

message VersionsRequest {
  Address at = 1;
  bytes name = 2;
  // limit bounds how many, newest first; zero is all of them.
  uint32 limit = 3;
  // here is as on CurrentRequest.
  bool here = 4;
}

message VersionsResponse {
  repeated Version versions = 1;
}

message DeleteRequest {
  Address at = 1;
  bytes name = 2;
}

message DeleteResponse {
  Version version = 1;
}

// ListRequest asks for the live objects of an instance, by name.
message ListRequest {
  Address at = 1;
  // prefix selects the names that begin with it; empty is every name.
  bytes prefix = 2;
  // after resumes a listing past this name.
  bytes after = 3;
  // limit bounds how many names; zero is all of them.
  uint32 limit = 4;
  // here is as on CurrentRequest.
  bool here = 5;
}

// ListResponse is each live object's current version, ordered by name.
message ListResponse {
  repeated Version versions = 1;
}

// ReadRequest asks for an object's bytes by their root, from whichever node holds
// them.
message ReadRequest {
  string root_cid = 1;
  // here reads only this node's blocks, never forwarding.
  bool here = 2;
}

message ReadResponse {
  bytes chunk = 1;
}

// ProbeRequest challenges a holder to prove it holds root_cid: the answer is an HMAC
// keyed by nonce over the blocks the nonce's descents of the DAG reach, which only a
// node that has those blocks can compute.
message ProbeRequest {
  string root_cid = 1;
  bytes nonce = 2;
}

message ProbeResponse {
  bytes proof = 1;
}

// Span is the counters (lo, hi] of one writer incarnation a shard replica merged.
message Span {
  string replica = 1;
  uint64 lo = 2;
  uint64 hi = 3;
}

// CoversRequest asks a holder of shard whether its copy has merged every span: a
// node placement moved the shard off keeps it open until enough holders have.
message CoversRequest {
  uint32 shard = 1;
  repeated Span spans = 2;
}

message CoversResponse {
  bool covered = 1;
}

// SupersededRequest asks a holder of an instance's shard what its copy holds of the
// version of name at stamp whose bytes are root_cid: what a node keeping those bytes
// collects them on.
message SupersededRequest {
  Address at = 1;
  bytes name = 2;
  uint64 stamp = 3;
  string root_cid = 4;
}

// SupersededResponse: held, the copy holds the version's row; superseded, it holds
// a newer row of the name too; kept, the version's row says its bucket keeps it.
message SupersededResponse {
  bool held = 1;
  bool superseded = 2;
  bool kept = 3;
}

service StorageService {
  // Put stores one object: a head, then its bytes in chunks.
  rpc Put(stream PutRequest) returns (PutResponse);
  rpc Current(CurrentRequest) returns (CurrentResponse);
  rpc Versions(VersionsRequest) returns (VersionsResponse);
  // Delete writes a tombstone, acknowledged like a put.
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc List(ListRequest) returns (ListResponse);
  // Read streams an object's bytes. A root no holder has is NotFound.
  rpc Read(ReadRequest) returns (stream ReadResponse);

  // Hold, Append, Probe, Covers and Superseded are one storage node asking
  // another. A holder that does not hold the root answers Probe NotFound, and one
  // that does not hold the shard open answers Superseded FailedPrecondition.
  rpc Hold(HoldRequest) returns (HoldResponse);
  rpc Append(AppendRequest) returns (AppendResponse);
  rpc Probe(ProbeRequest) returns (ProbeResponse);
  rpc Covers(CoversRequest) returns (CoversResponse);
  rpc Superseded(SupersededRequest) returns (SupersededResponse);
}
