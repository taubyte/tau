syntax = "proto3";

// store is what the build backend writes for itself, in kvdb. None of it is an RPC.
package tau.build.v2;

import "tau/build/v2/build.proto";

// JobEvent is one key under build/job/<id>/event/<at>/<writer>: one transition
// of one job, never rewritten. A job is the fold of its events in (at, writer)
// order, so two nodes holding the same events agree on the job without
// coordinating (services/build/backend/events.go).
message JobEvent {
  // at is the writer's clock, unix nanoseconds, strictly increasing per writer.
  int64 at = 1;
  // writer is the peer that appended it.
  string writer = 2;
  oneof kind {
    JobCreated created = 10;
    JobClaimed claimed = 11;
    JobSettled settled = 12;
    JobLogged logged = 13;
    JobCancelled cancelled = 14;
    JobRetried retried = 15;
  }
}

// JobCreated is the push a job builds. created_at is unix seconds.
message JobCreated {
  string repository_key = 1;
  string ref = 2;
  string commit_sha = 3;
  string project_id = 4;
  string environment = 5;
  string prelude = 6;
  int64 created_at = 7;
}

// JobClaimed is a builder taking one attempt. claimed_until is unix nanoseconds.
message JobClaimed {
  uint32 attempt = 1;
  string holder = 2;
  int64 claimed_until = 3;
}

// JobSettled is how one attempt ended: success or failure, its log, what it
// built, and for a plan the environment jobs it enqueued.
message JobSettled {
  uint32 attempt = 1;
  JobStatus status = 2;
  string reason = 3;
  string log = 4;
  map<string, string> assets = 5;
  repeated string children = 6;
}

// JobLogged is an attempt's log, recorded after the attempt ended some other way.
message JobLogged {
  uint32 attempt = 1;
  string log = 2;
}

// JobCancelled is a caller ending a job that had not ended.
message JobCancelled {
  string reason = 1;
}

// JobRetried is a caller reopening a job that had ended.
message JobRetried {}

// JobLive is what build/live/<project>/<env>/<resource>/<at>/<job>/<writer>
// holds: the artifact one successful job built for one resource, beside the settle
// that built it. The newest whose settle the job's fold applied is what runs.
message JobLive {
  string cid = 1;
}
