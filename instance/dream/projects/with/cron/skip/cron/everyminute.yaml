id: QmREVyn7gTwpYmasPnrCgkT9CFHi2YX8w3nmqsd3PzQvvU
description: every minute, because the first sight of a schedule records where the clock is and fires nothing - so a test has to wait for a real slot to come round, and a minute is the finest grain a cron expression has
schedule: "* * * * *"
timezone: UTC
# SKIP IS WRITTEN RATHER THAN DEFAULTED. It is what this project has always
# behaved as, and the name of the directory now says so -- a shape a project
# leans on the default for is a shape nothing states.
on_overlap: skip
function:
    cacher:
        ops: [invoke]
