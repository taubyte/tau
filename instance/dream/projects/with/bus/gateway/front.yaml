id: QmRQU7wVZSSJxC3PEPxnDfQdSL7q1Mn2d5g2L7Vos1iYCy
description: the door the browser attaches through - a bus owns no name, so reaching one costs a route and gains everything a route carries
host:
    zone:
        in:
            name: example_com
        name: live
# NO `methods:`. A websocket handshake is a GET and nothing else reaches this.
route:
    path: /
    match: prefix
    # AN ATTACHMENT IS A STANDING SUBSCRIPTION, so a route to a bus has to name
    # something that can refuse it: whoever completes the handshake receives
    # everything published from then on, and nothing downstream gets a second
    # chance to say no.
    authorizer:
        name: doorman
    handler:
        bus:
            name: live
