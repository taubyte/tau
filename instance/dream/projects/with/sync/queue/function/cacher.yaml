id: QmNP8ZJRT6En1LVfTwkbiD4HgdeRxvpHGn4m5Sp2cY8UxS
description: sends on the path it is asked on, and receives on the delivery path it declares - so one component is both the producer and the consumer
package:
    name: cacher_code
execution:
    call: handle
    timeout: 15s
    memory: 32MiB
cache:
    sessions:
        ops: [get, put]
sync:
    jobs:
        ops: [send, receive]
        deliver:
            path: /put/sessions/done
