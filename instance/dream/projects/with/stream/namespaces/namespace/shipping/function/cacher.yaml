id: QmNP8ZJRT6En1LVfTwkbiD4HgdeRxvpHGn4m5Sp2cY8UxS
description: a subscriber in shipping, named as the one in the other namespace is - it writes each message under a key of its own
package:
    name: cacher_code
execution:
    call: handle
    timeout: 15s
    memory: 32MiB
cache:
    sessions:
        namespace: /
        ops: [put]
stream:
    orders:
        namespace: /
        ops: [subscribe]
        deliver:
            path: /put/sessions/shipping-orders
    refunds:
        namespace: /
        ops: [subscribe]
        deliver:
            path: /put/sessions/shipping-refunds
