id: QmXnnyufdzAWL5CqZ2RnSNgPbvCc1ALT73s6epPrRnZ1He
description: the component the function runs - its own build, published under its own id
type: wasm
source:
    git: https://github.com/acme/handler
    branch: main
    path: services/handler
output: target/wasm32-wasip1/release/handler.wasm
build:
    steps:
        - name: build
          image: ghcr.io/samyfodil/wazy-build-rust:1.99.1-cc0.21.1
          commands:
              - cargo fetch --locked
              - cargo component build --release --locked --target wasm32-wasip2
