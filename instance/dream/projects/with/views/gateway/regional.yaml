description: says nothing about where it runs, so every region answers the name - region-2 does not run hello, and reaches it only through the tunnel
host:
    zone:
        in:
            name: example_com
        name: regional
route:
    path: /
    match: prefix
    methods: [GET, POST]
    handler:
        function:
            namespace: /eu
            name: hello
