description: runs in both regions, and reaches a handler that runs in one
host:
    zone:
        in:
            name: example_com
        name: www
route:
    path: /
    match: prefix
    methods: [GET]
    cache:
        ttl: 1m
        vary: [Accept-Language]
    handler:
        function:
            namespace: /origin
            name: api
